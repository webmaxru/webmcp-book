name: Build and check all book editions
description: Lint, build without warnings, and validate the EPUB on Ubuntu 24.04
inputs:
  root:
    description: Checked-out book directory
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install the build tools
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        timeout 4m python -m pip install -r tools/requirements.txt
        timeout 4m python -m playwright install chromium
    - name: Lint and render all three editions
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        set -eo pipefail
        python tools/lint_manuscript.py
        timeout 12m python tools/build.py all 2>&1 | tee "$RUNNER_TEMP/build.log"
        if grep -q '^warning:' "$RUNNER_TEMP/build.log"; then exit 1; fi
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: EPUBCheck
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        curl --fail --location --silent --show-error --retry 2 --max-time 90 \
          -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
        unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
        java -jar "$RUNNER_TEMP/epubcheck-5.2.1/epubcheck.jar" dist/*.epub
