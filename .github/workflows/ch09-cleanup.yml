name: Clean up unused Chapter 9 footnotes
on:
  push:
    branches: [ch09-w3c-polyfill]
    paths:
      - .github/workflows/ch09-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ch09-w3c-polyfill
      - name: Remove only unused footnote definitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('manuscript/09-first-webmcp-app.md')
          lines = path.read_bytes().splitlines(keepends=True)
          prefixes = (b'[^ch09-9]: ', b'[^ch09-15]: ', b'[^ch09-16]: ', b'[^ch09-17]: ')
          for prefix in prefixes:
              assert sum(line.startswith(prefix) for line in lines) == 1, prefix
          updated = [line for line in lines if not line.startswith(prefixes)]
          assert len(lines) - len(updated) == len(prefixes)
          path.write_bytes(b''.join(updated))
          PY
          git diff --check
          git diff -- manuscript/09-first-webmcp-app.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/09-first-webmcp-app.md
          git diff --cached --check
          git commit -m 'Remove unused Chapter 9 footnotes'
          git push origin HEAD:refs/heads/ch09-w3c-polyfill