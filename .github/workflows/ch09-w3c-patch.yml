name: Check Chapter 9 patch runner
on:
  push:
    branches: [ch09-w3c-polyfill]
    paths: [.github/workflows/ch09-w3c-patch.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check patch prerequisites
        run: |
          test "$GITHUB_REF" = refs/heads/ch09-w3c-polyfill
          test -f manuscript/09-first-webmcp-app.md
          git status --short
          python3 --version
