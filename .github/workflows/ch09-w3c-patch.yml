name: Patch Chapter 9 W3C polyfill
on:
  push:
    branches: [ch09-w3c-polyfill]
    paths: [.github/workflows/ch09-w3c-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ch09-w3c-polyfill
      - name: Patch only intended passages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('manuscript/09-first-webmcp-app.md')
          s=p.read_text(encoding='utf-8')
          def replace(old,new):
              global s
              assert s.count(old)==1, (old,s.count(old))
              s=s.replace(old,new,1)
          def between(start,end,replacement):
              global s
              assert s.count(start)==1 and s.count(end)==1, (start,end)
              a=s.index(start); b=s.index(end,a)
              s=s[:a]+replacement+s[b:]
          replace('https://cdn.jsdelivr.net/npm/@mcp-b/webmcp-polyfill@6.0.3/dist/index.iife.js', 'https://cdn.jsdelivr.net/npm/@w3c/webmcp-polyfill@0.1.1/dist/polyfill.js')
          replace('sha384-aEnX8+GGpZs7j3YINfHJw5npl4H6AkfYHQ5KqdgJzScZ5s76I533BzlPrceDInPx', 'sha256-qMH/jOVlACK6Z8tBBAsrXkzDga2qXWJKAXR7J+20Kok=')
          replace('};   // e.g. an old browser', '};')
          between('Everything here was run,', '## Local setup', """The companion repository's folder `chapters/09-first-webmcp-app/` holds the app, every numbered listing and a test suite. The original Chromium 156 observations in this chapter were made on 14 October 2026 and re-run on 2 November 2026 with the MCP-B polyfill. The demo now uses the W3C polyfill; a later run in Chromium 159 is recorded separately.[^ch09-2][^ch09-w3c-run]

          """.replace('\n          ','\n'))
          between('The order of the checks follows Figure 9.1.', '### Tools as thin wrappers', """The order of the checks follows Figure 9.1. An insecure page stops first: neither native WebMCP nor the W3C polyfill installs there.[^ch09-w3c] Native support wins next. A browser that already has `document.modelContext`, even a partial implementation, never downloads the fallback.

          The polyfill is opt-in, and the default is off. It gives in-page code a WebMCP context for registering, discovering and calling tools; it does not add a browser agent. In the demo, `?webmcp-polyfill` turns the fallback on, so you can exercise both paths.

          Listing 9.2 pins the standalone `@w3c/webmcp-polyfill` build to version 0.1.1 and includes a Subresource Integrity hash. If the request fails or the bytes do not match, the page keeps working with its tools off. If the script loads without installing a context, the module reports `polyfill-declined`. The package documents an `/auto` import and an explicit `installWebMCP()` function for applications with a build step.[^ch09-w3c]

          """.replace('\n          ','\n'))
          replace('Table 9.2 lists what it said in each configuration the tests run.', 'Table 9.2 records the original Chromium 156 run, which used the MCP-B polyfill. The current demo uses the W3C package; see the newer test run for its results.[^ch09-w3c-run]')
          between('## Polyfills and bridges', 'Google\u2019s WebMCP tools repository', """## Polyfills and bridges

          A polyfill gives a page a WebMCP context where the browser does not provide one. A bridge connects a page's tools to an agent outside the browser. They solve different problems, so let's look at them separately.

          ### The W3C polyfill

          Fjord Table uses `@w3c/webmcp-polyfill`, an open-source package from the W3C Open Source Program pilot. It follows the WebMCP Community Group draft, uses `webmcp-types` and has no runtime JavaScript dependencies. The draft is still changing; it is not a W3C Standard.[^ch09-w3c]

          If you use a bundler, install the package and load its automatic entry point before registering tools:

          ```bash
          npm install @w3c/webmcp-polyfill
          ```

          ```js
          import '@w3c/webmcp-polyfill/auto';
          ```

          You can instead import `installWebMCP` from `@w3c/webmcp-polyfill` and call it explicitly. Both routes leave an existing `document.modelContext` alone, including a partial native implementation. The installer does nothing outside a secure context. Listing 9.2 uses the package's standalone `dist/polyfill.js` build instead, loaded only when the page opts in and has no context.[^ch09-w3c]

          What can you test with it? Registration, discovery and execution from code in the page, including the Test Agent's search and booking flow. The package also implements cancellation and frame discovery. It does not implement declarative forms, and talking to an actual browser agent needs browser support. Native contexts do not join the polyfill's channels, so check agent and bridge compatibility rather than assuming the two runtimes connect.[^ch09-w3c]

          The demo tests load the installed, pinned bundle in place of the CDN response, which keeps the integrity check in the browser. In the 18 November run, the Test Agent searched and booked with guest confirmation; the blocked-download and native paths passed too.[^ch09-w3c-run]

          """.replace('\n          ','\n'))
          between('> **Still in flux:** *Polyfills track a moving target.*', '### Bridging to desktop agents', "> **Still in flux:** *Polyfills track a moving target.* The W3C package follows a Community Group draft that is still changing. Pin the version, read its release notes before upgrading, and run your own tests against both the polyfill and native WebMCP.[^ch09-w3c]\n\n")
          between('Its 22 tests pass against Chromium 156', 'Bottomline:', """The original suite ran in Chromium 156 with the MCP-B polyfill, native WebMCP and a mock. On 18 November, the updated W3C demo passed 21 browser and static checks in Chromium 159.0.8154.6, plus seven output-schema tests. The optional listing comparison was not enabled in that run.[^ch09-w3c-run] Chapter 10 moves to the bigger project, the Trailhead store, and to the questions a component framework raises: tools that come and go with views, shared state, and routing.

          """.replace('\n          ','\n'))
          between('- Load a polyfill only by choice,', '\n- Explore with Chrome', '- Load a polyfill only by choice, pinned and with an integrity hash. `@w3c/webmcp-polyfill` 0.1.1 leaves an existing context alone, requires a secure context and does not validate tool arguments or implement declarative forms.[^ch09-w3c]')
          replace('## Notes\n', '## Notes\n\n[^ch09-w3c]: W3C Open Source Program, `@w3c/webmcp-polyfill` README, version 0.1.1: installation, native coexistence, secure contexts and implementation status (retrieved November 2026). <https://www.npmjs.com/package/@w3c/webmcp-polyfill>\n[^ch09-w3c-run]: Companion demo GitHub Actions, Chapter 9 test run of 18 November 2026. <https://github.com/webmaxru/webmcp-book-demos/actions/runs/44382818272>\n')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff --stat
          git diff -- manuscript/09-first-webmcp-app.md
      - name: Commit scoped patch to feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/ch09-w3c-polyfill
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/09-first-webmcp-app.md
          git diff --cached --check
          git commit -m 'Use W3C WebMCP polyfill in Chapter 9'
          git push origin HEAD:refs/heads/ch09-w3c-polyfill
