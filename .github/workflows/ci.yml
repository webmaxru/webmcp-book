name: Book CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: book-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check release scope, version and evidence
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/release_policy.py --base "$(git merge-base "$BASE" HEAD)"
      - uses: ./.github/actions/build-editions
      - uses: actions/upload-artifact@v7
        with:
          name: book-${{ github.sha }}
          path: |
            dist/*.pdf
            dist/*.epub
            dist/*.zip
          if-no-files-found: error
          retention-days: 3
  preflight:
    name: Book release preflight
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: test "$BUILD" = success
        env:
          BUILD: ${{ needs.build.result }}
