name: deploy-swa
# Production serves released editions only. There are two ways in:
#   - A push to main deploys main, but only while its book content equals the latest published
#     release. The published-source job decides (tools/book_release.py published-source; the
#     content definition lives in tools/release_policy.py, not in this file). Unreleased content,
#     for example a content PR merged by hand, stays off the site until the controller releases it.
#   - A manual run deploys a released edition: Actions > deploy-swa > Run workflow > ref = a
#     published release tag (vX.Y.Z) or the full SHA of its commit. This is the rollback path.
#     Branches, drafts, prereleases and unreleased commits are refused.
# The "Release book" workflow dispatches this workflow for its own tag right after publishing.
#
# Builds the web edition (python3 tools/build.py site -> dist/site) and uploads it to the
# Azure Static Web App created by infra/deploy.sh (Free plan). Needs one repository secret,
# AZURE_STATIC_WEB_APPS_API_TOKEN (the app's deployment token; infra/deploy.sh sets it).
# Until that secret exists (forks, a fresh clone, PRs) the deploy job skips and the run stays green.
#
# Only refs that contain tools/build.py (v2.0.0 and later) can be built by this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Published release tag (vX.Y.Z) or the full commit SHA of one. Rollback path; anything unreleased is refused."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  published-source:
    # The gate. It decides from the releases API and the tags (tools/book_release.py), never from path patterns here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: python tools/book_release.py published-source --head "$GITHUB_SHA" --ref "$REF"

  deploy:
    needs: published-source
    if: github.ref == 'refs/heads/main' && needs.published-source.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
      # The commit and the release edition the gate approved: main itself for a push, the release commit for a manual run.
      DEPLOY_REF: ${{ needs.published-source.outputs.sha }}
      EDITION: ${{ needs.published-source.outputs.tag }}
    steps:
      - name: Skip until the Static Web App exists
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice title=Web edition not deployed::Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret (run ./infra/deploy.sh, see DEPLOY.md)."
          echo "Web edition not deployed: the **AZURE_STATIC_WEB_APPS_API_TOKEN** repository secret is missing. Run \`./infra/deploy.sh\` (see DEPLOY.md)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout ${{ env.DEPLOY_REF }}
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Check that this ref has the build pipeline
        if: env.HAS_TOKEN == 'true'
        run: |
          if [ ! -f tools/build.py ]; then
            echo "::error::$DEPLOY_REF has no tools/build.py, so it can't be built by this workflow. Pick v2.0.0 or a later tag."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements*.txt

      - name: Build the site
        if: env.HAS_TOKEN == 'true'
        run: |
          req=tools/requirements.txt
          [ -f tools/requirements-site.txt ] && req=tools/requirements-site.txt
          python3 -m pip install -r "$req"
          python3 tools/build.py site
          test -f dist/site/index.html
          # tools/build.py copies it; this covers older build scripts.
          if [ -f staticwebapp.config.json ] && [ ! -f dist/site/staticwebapp.config.json ]; then
            cp staticwebapp.config.json dist/site/
          fi
          echo "dist/site: $(find dist/site -type f | wc -l) files, $(du -sh dist/site | cut -f1)"

      - name: Pre-upload check (Free plan limits, CSP vs. the pages)
        if: env.HAS_TOKEN == 'true'
        run: |
          if [ -f infra/check_site.py ]; then python3 infra/check_site.py dist/site; else echo "no infra/check_site.py in this ref, skipped"; fi

      - name: Deploy to Azure Static Web Apps (production)
        id: swa
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/site
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        env:
          SITE: ${{ steps.swa.outputs.static_web_app_url }}
        run: |
          SITE="${SITE%/}"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          missing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/no-such-page-$GITHUB_RUN_ID" || true)
          {
            echo "## Web edition deployed"
            echo
            echo "- Edition: \`$EDITION\`"
            echo "- Ref: \`$DEPLOY_REF\`"
            echo "- URL: $SITE"
            echo "- \`/\` -> $code, missing page -> $missing (expected 200 and 404)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || { echo "::error::$SITE/ answered $code"; exit 1; }
