name: Finalize WebMCP outputSchema manuscript update

on:
  push:
    branches: [output-schema-update]
    paths:
      - .github/workflows/finalize-output-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the paired demo listings
        run: git clone --depth 1 --branch output-schema-update https://github.com/webmaxru/webmcp-book-demos.git "$RUNNER_TEMP/webmcp-book-demos"
      - name: Repair the prepared update script anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-output-schema-update.py')
          source = p.read_text()
          old_heading = '## Layer 4: evaluations against real models'
          new_heading = '## Layer 4: evals'
          if old_heading in source:
              source = source.replace(old_heading, new_heading, 1)
          elif new_heading not in source:
              raise SystemExit('Chapter 14 Layer 4 heading not found')

          # The earlier Chapter 5 callout edit already changes this text; this
          # later edit has a stale anchor and is redundant.
          obsolete = source.find('Chapter 5 output subsection old start')
          if obsolete >= 0:
              start = source.rfind('edit(p,', 0, obsolete)
              end = source.find('edit(p,', obsolete)
              if start < 0 or end < 0:
                  raise SystemExit('Could not isolate redundant Chapter 5 edit')
              source = source[:start] + source[end:]

          phrase = 'Output schemas are resolved in principle and in an open PR (#254)'
          at = source.find(phrase)
          if at < 0:
              raise SystemExit('Chapter 17 summary edit not found')
          start = source.rfind('edit(p,', 0, at)
          label = source.find('Chapter 17 summary output schema', at)
          if start < 0 or label < 0:
              raise SystemExit('Could not isolate Chapter 17 summary edit')
          end = source.find('edit(p,', label)
          if end < 0:
              raise SystemExit('Could not locate the edit after the Chapter 17 summary')
          replacement = '''summary = read(p)
          lines = summary.splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip().startswith('- Output schemas are resolved')]
          if matches:
              if len(matches) != 1:
                  raise RuntimeError('Chapter 17 has multiple output-schema summary bullets')
              lines[matches[0]] = '  - PR #254 added optional `outputSchema` to the spec on 2 November. Issue #92 remains open on validation behavior. Chromium 156 still drops the member from `getTools()`; agent harnesses should validate declared results before returning them to a model.'
          elif not any('PR #254 added optional `outputSchema` to the spec on 2 November.' in line for line in lines):
              raise RuntimeError('Chapter 17 outputSchema summary bullet not found')
          updates[p] = '\\n'.join(lines) + '\\n'
          '''
          source = source[:start] + replacement + source[end:]
          # The source manuscript nests this block quote inside a numbered list.
          for heading in ('output schemas', 'output validation'):
              unindented = f'"""> **Still in flux:** {heading}'
              indented = f'""">  > **Still in flux:** {heading}'
              if unindented in source:
                  source = source.replace(unindented, indented, 1)
              elif indented not in source:
                  raise SystemExit(f'Chapter 17 callout anchor not found: {heading}')
          p.write_text(source)

          # Normalize the checklist line by its stable prefix.
          chapter = Path('manuscript/17-the-road-ahead.md')
          lines = chapter.read_text(encoding='utf-8').splitlines()
          prefix = '2. **Put the API shape in one file.**'
          desired = '  2. **Put the API shape in one file.** Only the adapter calls `document.modelContext` (Listing 17.2). When continuation support or a new exposure keyword arrives, or the API moves again (Appendix D covers the last move), one file changes. The adapter already passes `outputSchema` through.'
          matches = [i for i, line in enumerate(lines) if line.strip().startswith(prefix)]
          if len(matches) == 1:
              lines[matches[0]] = desired
              chapter.write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
          elif not any(line == desired for line in lines):
              raise SystemExit(f'Expected one Chapter 17 API-shape checklist line, found {len(matches)}')
          PY
      - name: Apply manuscript edits and preserve failures
        run: |
          set +e
          python3 .github/scripts/apply-output-schema-update.py "$RUNNER_TEMP/webmcp-book-demos" > /tmp/manuscript-update.log 2>&1
          result=$?
          cat /tmp/manuscript-update.log
          if [ "$result" -ne 0 ]; then
            mkdir -p .github/workflow-logs
            cp /tmp/manuscript-update.log .github/workflow-logs/manuscript-update-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+actions[bot]@users.noreply.github.com"
            git add .github/workflow-logs/manuscript-update-error.txt
            git commit -m "Record manuscript update error" || true
            git push origin HEAD:output-schema-update || true
            exit "$result"
          fi
      - name: Run manuscript lint and build
        run: |
          python3 tools/lint_manuscript.py
          python3 -m pip install -r tools/requirements.txt
          python3 tools/build.py zip
      - name: Commit manuscript changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply-output-schema-update.py
          rm -f .github/workflows/apply-output-schema-update.yml .github/workflows/finalize-output-schema.yml .github/workflows/run-output-schema-update.yml .github/workflows/verify-output-schema-manuscript.yml
          rm -rf .github/workflow-logs
          git add -A .github manuscript/05-registering-tools.md manuscript/09-first-webmcp-app.md manuscript/11-designing-tools.md manuscript/14-testing-debugging-evals.md manuscript/15-browser-support-and-standards.md manuscript/17-the-road-ahead.md manuscript/appendix-a-api-reference.md VALIDATION.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Update book for WebMCP outputSchema"
            git push origin HEAD:output-schema-update
          else
            echo "No manuscript changes to commit"
          fi
