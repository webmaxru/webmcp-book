name: Finalize WebMCP outputSchema manuscript update

on:
  push:
    branches: [output-schema-update]
    paths:
      - .github/workflows/finalize-output-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the paired demo listings
        run: git clone --depth 1 --branch output-schema-update https://github.com/webmaxru/webmcp-book-demos.git "$RUNNER_TEMP/webmcp-book-demos"
      - name: Repair manuscript anchors in the prepared updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/scripts/apply-output-schema-update.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('## Layer 4: evaluations against real models', '## Layer 4: evals')

          # Remove the redundant Chapter 5 fragment edit superseded by the full
          # output-schema callout replacement earlier in this updater.
          label = "Chapter 5 output subsection old start')"
          if label in source:
              label_at = source.index(label)
              start = source.rfind('edit(p,', 0, label_at)
              end = label_at + len(label)
              if start < 0:
                  raise SystemExit('Could not isolate redundant Chapter 5 callout edit')
              source = source[:start] + source[end:].lstrip('\\r\\n')

          # Match anchors independent of Markdown list/blockquote indentation.
          pattern = re.compile(r'(?ms)^[ \\t]*def replace_once\\b.*?(?=^[ \\t]*def edit\\b)')
          match = pattern.search(source)
          if not match:
              raise SystemExit('Could not find replace_once() in the manuscript updater')
          replacement = '''def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              old_lines = old.splitlines()
              actual = text.splitlines(keepends=True)
              plain = [line.rstrip("\\r\\n") for line in actual]
              expected = [line.rstrip("\\r\\n") for line in old_lines]
              for i in range(len(plain) - len(expected) + 1):
                  if all(plain[i + j].strip() == expected[j].strip() for j in range(len(expected))):
                      indent = plain[i][:len(plain[i]) - len(plain[i].lstrip(" \\t"))]
                      new_lines = new.splitlines()
                      if new_lines:
                          new_lines[0] = indent + new_lines[0].lstrip(" \\t")
                      begin = sum(len(line) for line in actual[:i])
                      finish = sum(len(line) for line in actual[:i + len(expected)])
                      newline = "\\n" if actual[i + len(expected) - 1].endswith("\\n") else ""
                      return text[:begin] + "\\n".join(new_lines) + newline + text[finish:]
              raise RuntimeError(f"{label}: expected text not found: {old[:140]!r}")

          '''
          source = source[:match.start()] + replacement + source[match.end():]
          path.write_text(source, encoding='utf-8')
          print('Prepared updater anchors are repaired')
          PY
      - name: Apply manuscript edits
        run: python3 .github/scripts/apply-output-schema-update.py "$RUNNER_TEMP/webmcp-book-demos"
      - name: Run manuscript lint and build
        run: |
          python3 tools/lint_manuscript.py
          python3 -m pip install -r tools/requirements.txt
          python3 tools/build.py zip
      - name: Remove temporary workflows and commit manuscript changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply-output-schema-update.py
          rm -f .github/workflows/apply-output-schema-update.yml .github/workflows/finalize-output-schema.yml .github/workflows/run-output-schema-update.yml .github/workflows/verify-output-schema-manuscript.yml
          rm -rf .github/workflow-logs
          git add -A .github manuscript/05-registering-tools.md manuscript/09-first-webmcp-app.md manuscript/11-designing-tools.md manuscript/14-testing-debugging-evals.md manuscript/15-browser-support-and-standards.md manuscript/17-the-road-ahead.md manuscript/appendix-a-api-reference.md VALIDATION.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Update book for WebMCP outputSchema"
            git push origin HEAD:output-schema-update
          else
            echo "No manuscript changes to commit"
          fi
