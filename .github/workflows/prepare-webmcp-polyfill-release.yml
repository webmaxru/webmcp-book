name: Prepare WebMCP polyfill book addition
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'add-webmcp-polyfill-2.2.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install book dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Add the content and release metadata
        run: |
          set -euo pipefail
          sed -i '/prepare-webmcp-polyfill-release.yml.*unlink()/d' tools/_prepare_webmcp_polyfill_release.py
          python3 tools/_prepare_webmcp_polyfill_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Add WebMCP polyfill and prepare v2.2.0'
          git push origin HEAD:add-webmcp-polyfill-2.2.0
