name: Clean book previews
on:
  workflow_run:
    workflows: [Book CI]
    types: [completed]
permissions: {}
concurrency:
  group: preview-cleanup-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Remove superseded previews using trusted code only
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
        run: python tools/artifact_storage.py previews --run-id "$PRODUCER_RUN"
