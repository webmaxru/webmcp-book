name: Release book
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Approved and controller-merged PR number
        required: true
      head_sha:
        description: Approved head commit
        required: true
      base_sha:
        description: Main commit before the squash
        required: true
      merge_sha:
        description: Squash commit on main
        required: true
      tag:
        description: Tag matching the book version on the squash commit
        required: true
permissions: {}
concurrency:
  group: book-publish
  cancel-in-progress: false
env:
  PR: ${{ inputs.pr }}
  HEAD: ${{ inputs.head_sha }}
  BASE: ${{ inputs.base_sha }}
  MERGE: ${{ inputs.merge_sha }}
  TAG: ${{ inputs.tag }}
jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      recovery: ${{ steps.plan.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/book_release.py release-plan --pr "$PR" --head "$HEAD" --base "$BASE" --merge "$MERGE" --tag "$TAG"

  build:
    needs: authorize
    if: needs.authorize.outputs.recovery == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-editions
      - name: Collect release files
        run: |
          mkdir release
          cp dist/*.pdf dist/*.epub dist/*.zip release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: editions-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: editions-${{ inputs.tag }}
          path: release
      - name: Recheck provenance, publish, and verify stable deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/book_release.py publish --pr "$PR" --head "$HEAD" --base "$BASE" --merge "$MERGE" --tag "$TAG"
