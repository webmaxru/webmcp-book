name: Verify WebMCP outputSchema manuscript

on:
  push:
    branches: [output-schema-update]
    paths:
      - .github/workflows/verify-output-schema-manuscript.yml
      - .github/scripts/apply-output-schema-update.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone the paired demo listings
        run: git clone --depth 1 --branch output-schema-update https://github.com/webmaxru/webmcp-book-demos.git "$RUNNER_TEMP/webmcp-book-demos"
      - name: Repair the two stale script anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/scripts/apply-output-schema-update.py')
          source = path.read_text()
          old = '## Layer 4: evaluations against real models'
          new = '## Layer 4: evals'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Chapter 14 Layer 4 heading not found')

          duplicate = re.compile(r"\\n\\s+edit\\(p,\\n\\s+\\\"\\\"\\\"\\*Output schemas\\.\\* MCP tools can declare.*?Chapter 5 output subsection old start'\\)\\n", re.S)
          source, removed = duplicate.subn('\\n', source, count=1)
          if removed == 0 and 'Chapter 5 output subsection old start' in source:
              raise SystemExit('Could not remove the duplicate obsolete output-schema callout edit')

          start = source.find('  edit(p,\\n  \\\"\\\"\\\"  - Output schemas are resolved')
          end_marker = '\\n  edit(p,\\n  \\\"\\\"\\\"**Listing 17.1**'
          if start >= 0:
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Chapter 17 summary edit boundary not found')
              replacement = '''  summary = read(p)
    summary, count = re.subn(
        r"(?m)^  - Output schemas are resolved.*$",
        "  - PR #254 added optional `outputSchema` to the spec on 2 November. Issue #92 remains open on validation behavior. Chromium 156 still drops the member from `getTools()`; agent harnesses should validate declared results before returning them to a model.",
        summary,
        count=1,
    )
    if count != 1:
        raise RuntimeError('Chapter 17 outputSchema summary line not found')
    updates[p] = summary
  '''
              source = source[:start] + replacement + source[end:]
          elif 'Chapter 17 outputSchema summary line not found' not in source:
              raise SystemExit('Chapter 17 summary edit not found')

          path.write_text(source)
          PY
      - name: Apply manuscript edits and run lint
        run: |
          python3 .github/scripts/apply-output-schema-update.py "$RUNNER_TEMP/webmcp-book-demos"
          python3 tools/lint_manuscript.py
      - name: Build the web edition
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/build.py zip
      - name: Commit manuscript changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          git add manuscript/05-registering-tools.md manuscript/09-first-webmcp-app.md manuscript/11-designing-tools.md manuscript/14-testing-debugging-evals.md manuscript/15-browser-support-and-standards.md manuscript/17-the-road-ahead.md manuscript/appendix-a-api-reference.md VALIDATION.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Update book for WebMCP outputSchema"
            git push origin HEAD:output-schema-update
          else
            echo "No manuscript changes to commit"
          fi
