<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect x="30" y="20" width="1140" height="640" rx="14" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="3"/><text x="60" y="62" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="26" fill="#0EA5A5">Browser</text><rect x="190" y="36" width="520" height="40" rx="20" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="212" y="62" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="18" fill="#5A6478">https://trailhead.example</text><rect x="760" y="32" width="390" height="50" rx="9" fill="#B87613"/><text x="785" y="64" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#FFFFFF">2</text><text x="815" y="64" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="22" fill="#FFFFFF">Extension</text><text x="935" y="64" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">installed into the browser</text><rect x="55" y="100" width="690" height="535" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="80" y="138" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#3F38D6">The page the user sees</text><text x="80" y="164" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">same DOM, same session, same user</text><rect x="80" y="185" width="195" height="170" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><rect x="95" y="200" width="165" height="70" rx="6" fill="#DCE1EC"/><text x="95" y="298" text-anchor="start" font-family="Bricolage Grotesque" font-weight="600" font-size="17" fill="#171A22">Fjellheim 2 Tent</text><text x="95" y="322" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#5A6478">3 499 kr</text><rect x="295" y="185" width="195" height="170" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><rect x="310" y="200" width="165" height="70" rx="6" fill="#DCE1EC"/><text x="310" y="298" text-anchor="start" font-family="Bricolage Grotesque" font-weight="600" font-size="17" fill="#171A22">Vidde Sleeping Bag</text><text x="310" y="322" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#5A6478">2 199 kr</text><rect x="510" y="185" width="195" height="170" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><rect x="525" y="200" width="165" height="70" rx="6" fill="#DCE1EC"/><text x="525" y="298" text-anchor="start" font-family="Bricolage Grotesque" font-weight="600" font-size="17" fill="#171A22">Ridge 45 Backpack</text><text x="525" y="322" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#5A6478">1 899 kr</text><rect x="80" y="375" width="240" height="48" rx="9" fill="#5A54F0"/><text x="200" y="406" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#FFFFFF">Add to cart</text><rect x="340" y="375" width="200" height="48" rx="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="440" y="406" text-anchor="middle" font-family="Literata" font-weight="400" font-size="18" fill="#5A6478">Search…</text><rect x="420" y="455" width="305" height="160" rx="9" fill="#B87613"/><text x="445" y="492" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#FFFFFF">3</text><text x="475" y="492" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="22" fill="#FFFFFF">Page-embedded agent</text><text x="445" y="522" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">ships inside the website</text><rect x="445" y="540" width="255" height="52" rx="9" fill="#FFFFFF"/><text x="462" y="572" text-anchor="start" font-family="Literata" font-weight="400" font-size="15" fill="#171A22">“Find me a 2-person tent”</text><rect x="770" y="100" width="375" height="535" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="795" y="140" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#8F5A0C">1</text><text x="825" y="140" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#8F5A0C">Built-in assistant</text><text x="795" y="166" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">part of the browser itself</text><rect x="845" y="190" width="275" height="70" rx="9" fill="#EEF1F8"/><text x="860" y="220" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#171A22">Is there a 2-person tent</text><text x="860" y="244" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#171A22">under 4 000 kr in stock?</text><rect x="795" y="280" width="275" height="46" rx="9" fill="#B87613"/><text x="810" y="309" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">Looking at this page…</text><text x="795" y="600" text-anchor="start" font-family="Literata" font-weight="400" font-size="15" fill="#5A6478">e.g. Gemini in Chrome, Perplexity Comet</text><path d="M 795,360 C 760,360 745,300 712,290" fill="none" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><path d="M 758,57 C 732,57 735,170 700,190" fill="none" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><path d="M 420,500 C 330,480 260,460 230,428" fill="none" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="958" y="420" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#171A22">All three act on</text><text x="958" y="446" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#171A22">the same page</text><text x="958" y="480" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">what the user sees is</text><text x="958" y="502" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">what the agent works on</text></svg>
