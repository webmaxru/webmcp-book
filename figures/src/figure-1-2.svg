t-weight="400" font-size="14" fill="#FFFFFF">set max price 4 000</text><line x1="840" y1="250" x2="872" y2="250" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="875" y="90" width="240" height="330" rx="12" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="995" y="122" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#171A22">Step 4</text><rect x="895" y="140" width="200" height="62" rx="9" fill="#0EA5A5"/><text x="995" y="168" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#FFFFFF">Observe</text><text x="995" y="190" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#FFFFFF">screenshot or snapshot</text><line x1="995" y1="202" x2="995" y2="228" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="895" y="230" width="200" height="62" rx="9" fill="#B87613"/><text x="995" y="258" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#FFFFFF">Decide</text><text x="995" y="280" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#FFFFFF">model reads the page</text><line x1="995" y1="292" x2="995" y2="318" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="895" y="320" width="200" height="62" rx="9" fill="#5A54F0"/><text x="995" y="348" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#FFFFFF">Act</text><text x="995" y="370" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#FFFFFF">open the first result</text><text x="600" y="442" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">…and again for every scroll, filter, field and button: dozens of round trips, each with a fresh image</text><rect x="20" y="475" width="1160" height="285" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="50" y="517" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="28" fill="#171A22">Structured tool call</text><text x="338" y="517" text-anchor="start" font-family="Literata" font-weight="400" font-size="18" fill="#5A6478">one request to code the site already runs</text><rect x="50" y="560" width="200" height="150" rx="12" fill="#B87613"/><text x="150" y="628" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#FFFFFF">Agent</text><text x="150" y="656" text-anchor="middle" font-family="Literata" font-weight="400" font-size="15" fill="#FFFFFF">picks a tool</text><rect x="930" y="560" width="220" height="150" rx="12" fill="#5A54F0"/><text x="1040" y="618" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="22" fill="#FFFFFF">The site’s tool</text><text x="1040" y="646" text-anchor="middle" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#FFFFFF">search_products</text><text x="1040" y="672" text-anchor="middle" font-family="Literata" font-weight="400" font-size="15" fill="#FFFFFF">its own code</text><line x1="250" y1="584" x2="926" y2="584" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><line x1="930" y1="686" x2="254" y2="686" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><rect x="290" y="548" width="600" height="72" rx="9" fill="#10141F"/><text x="310" y="578" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#E6EAF6">search_products({ query: "2-person tent",</text><text xml:space="preserve" x="310" y="602" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#E6EAF6">                  maxPrice: 4000, inStock: true })</text><rect x="290" y="650" width="600" height="72" rx="9" fill="#10141F"/><text x="310" y="680" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#7FD0A6">{ products: [{ name: "Fjellheim 2 Tent",</text><text xml:space="preserve" x="310" y="704" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="16" fill="#7FD0A6">               inStock: true, … }] }</text><text x="600" y="748" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">one call, one structured result, no screenshots</text></svg>
