<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="846" viewBox="0 0 1200 846"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="846" fill="#FFFFFF"/><rect x="30" y="40" width="250" height="120" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="50" y="78.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#3F38D6" xml:space="preserve">User</text><text x="50" y="106.0" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">signed in to Ledgerly,</text><text x="50" y="127.1" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">asks the agent for help</text><line x1="155" y1="160" x2="155" y2="300" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="165" y="236.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">asks</text><rect x="30" y="305" width="250" height="170" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="50" y="343.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#8F5A0C" xml:space="preserve">Agent</text><text x="50" y="372.0" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">model + harness.</text><text x="50" y="393.1" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">Reads tool text and</text><text x="50" y="414.2" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">results as tokens,</text><text x="50" y="435.4" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">decides what to call</text><rect x="340" y="40" width="250" height="435" rx="14" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="2.5"/><text x="360" y="78.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#0B8484" xml:space="preserve">Browser</text><text x="360" y="108.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">keeps the tool map</text><text x="360" y="129.1" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">per document and</text><text x="360" y="150.2" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">enforces:</text><text x="372" y="180.0" font-family="IBM Plex Mono" font-size="14" fill="#0B8484" xml:space="preserve">Permissions-Policy</text><text x="372" y="200.3" font-family="IBM Plex Mono" font-size="14" fill="#0B8484" xml:space="preserve">"tools"</text><text x="372" y="220.6" font-family="IBM Plex Mono" font-size="14" fill="#0B8484" xml:space="preserve">secure contexts</text><text x="372" y="240.9" font-family="IBM Plex Mono" font-size="14" fill="#0B8484" xml:space="preserve">exposedTo /</text><text x="372" y="261.2" font-family="IBM Plex Mono" font-size="14" fill="#0B8484" xml:space="preserve">fromOrigins</text><text x="360" y="330.0" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">does not check calls</text><text x="360" y="351.1" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">against inputSchema,</text><text x="360" y="372.2" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">read descriptions for</text><text x="360" y="393.4" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">intent or inspect</text><text x="360" y="414.5" font-family="Literata" font-size="16" fill="#5A6478" xml:space="preserve">results</text><line x1="280" y1="365" x2="336" y2="365" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="288" y="352.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">calls, args</text><line x1="338" y1="430" x2="284" y2="430" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="288" y="456.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">tool text,</text><text x="288" y="473.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">results</text><circle cx="308" cy="395" r="17" fill="#C2468A"/><text x="308" y="402.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">3</text><circle cx="308" cy="490" r="17" fill="#C2468A"/><text x="308" y="497.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">1</text><rect x="650" y="30" width="320" height="560" rx="14" fill="#FFFFFF" stroke="#5A6478" stroke-width="2" stroke-dasharray="8 6"/><text x="668" y="60.0" font-family="IBM Plex Mono" font-size="14" fill="#5A6478" xml:space="preserve">https://app.ledgerly.example</text><rect x="668" y="76" width="284" height="120" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="686" y="108.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#3F38D6" xml:space="preserve">First-party tools</text><text x="686" y="134.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">your code: names,</text><text x="686" y="154.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">descriptions, schemas,</text><text x="686" y="174.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">execute()</text><rect x="668" y="214" width="284" height="120" rx="14" fill="#FFFFFF" stroke="#C2468A" stroke-width="2.5"/><text x="686" y="246.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#C2468A" xml:space="preserve">Third-party script</text><text x="686" y="272.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">analytics, chat, A/B tests,</text><text x="686" y="292.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">runs with Ledgerly's origin</text><rect x="668" y="352" width="284" height="220" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="686" y="384.0" font-family="IBM Plex Mono" font-size="15" fill="#0B8484" xml:space="preserve">&lt;iframe&gt;</text><text x="686" y="412.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#0B8484" xml:space="preserve">Supportly widget</text><text x="686" y="436.0" font-family="IBM Plex Mono" font-size="13" fill="#5A6478" xml:space="preserve">widget.supportly.example</text><text x="686" y="466.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">its own origin. Has tools</text><text x="686" y="486.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">only if Ledgerly allows</text><text x="686" y="506.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">"tools", and exposes them</text><text x="686" y="526.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">only through exposedTo</text><circle cx="952" cy="90" r="17" fill="#C2468A"/><text x="952" y="97.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">4</text><circle cx="952" cy="228" r="17" fill="#C2468A"/><text x="952" y="235.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">6</text><circle cx="952" cy="366" r="17" fill="#C2468A"/><text x="952" y="373.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">5</text><line x1="590" y1="160" x2="664" y2="160" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><line x1="664" y1="200" x2="594" y2="200" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="627" cy="128" r="17" fill="#C2468A"/><text x="627" y="135.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">1</text><rect x="1000" y="76" width="170" height="170" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2.5"/><text x="1016" y="108.0" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#5A6478" xml:space="preserve">Another site</text><text x="1016" y="134.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">another tab or</text><text x="1016" y="154.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">frame, with its</text><text x="1016" y="174.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">own tools and</text><text x="1016" y="194.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">intentions</text><rect x="1000" y="352" width="170" height="190" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2.5"/><text x="1016" y="384.0" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#5A6478" xml:space="preserve">Untrusted</text><text x="1016" y="408.0" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#5A6478" xml:space="preserve">content</text><text x="1016" y="436.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">community</text><text x="1016" y="456.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">answers, emails,</text><text x="1016" y="476.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">reviews, ticket</text><text x="1016" y="496.0" font-family="Literata" font-size="15" fill="#5A6478" xml:space="preserve">text</text><line x1="1000" y1="160" x2="972" y2="160" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="985" cy="195" r="17" fill="#C2468A"/><text x="985" y="202.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">7</text><line x1="1000" y1="450" x2="954" y2="450" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="977" cy="490" r="17" fill="#C2468A"/><text x="977" y="497.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">2</text><rect x="30" y="600" width="1140" height="196" rx="14" fill="#F6F7FB"/><circle cx="58" cy="625" r="17" fill="#C2468A"/><text x="58" y="632.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">1</text><text x="86" y="631.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Tool poisoning: text written to steer the agent</text><text x="568" y="631.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.1.1</text><circle cx="628" cy="625" r="17" fill="#C2468A"/><text x="628" y="632.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">2</text><text x="656" y="631.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Output injection: untrusted text inside a result</text><text x="1138" y="631.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.1.2</text><circle cx="58" cy="669" r="17" fill="#C2468A"/><text x="58" y="676.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">3</text><text x="86" y="675.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Over-parameterisation: the agent volunteers user data</text><text x="568" y="675.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.3</text><circle cx="628" cy="669" r="17" fill="#C2468A"/><text x="628" y="676.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">4</text><text x="656" y="675.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Misrepresentation: the tool does more than it says</text><text x="1138" y="675.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.2</text><circle cx="58" cy="713" r="17" fill="#C2468A"/><text x="58" y="720.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">5</text><text x="86" y="719.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Cross-origin exposure across frames (two-sided opt-in)</text><text x="568" y="719.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.4</text><circle cx="628" cy="713" r="17" fill="#C2468A"/><text x="628" y="720.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">6</text><text x="656" y="719.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">Script in your origin tampers with registration</text><text x="1138" y="719.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.4.1</text><circle cx="58" cy="757" r="17" fill="#C2468A"/><text x="58" y="764.0" font-family="Bricolage Grotesque" font-size="19" font-weight="800" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">7</text><text x="86" y="763.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">A hijacked agent calls your tools as the target</text><text x="568" y="763.0" font-family="IBM Plex Mono" font-size="15" text-anchor="end" fill="#0B8484" xml:space="preserve">§6.3.1.3</text><text x="600" y="829.0" font-family="Literata" font-size="14" text-anchor="middle" fill="#5A6478" xml:space="preserve">Section numbers refer to the WebMCP draft of 27 October 2026.</text></svg>