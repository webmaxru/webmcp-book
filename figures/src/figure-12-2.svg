text><rect x="832" y="272" width="316" height="40" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="844" y="297.0" font-family="IBM Plex Mono" font-size="13" fill="#171A22" xml:space="preserve">search_articles  read-only, untrusted</text><rect x="832" y="322" width="316" height="40" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="844" y="347.0" font-family="IBM Plex Mono" font-size="13" fill="#171A22" xml:space="preserve">get_ticket_status  read-only</text><rect x="832" y="392" width="316" height="40" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="844" y="417.0" font-family="IBM Plex Mono" font-size="13" fill="#171A22" xml:space="preserve">create_ticket  consequential</text><text x="846" y="456.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">exposed to nobody, confirmed</text><text x="846" y="474.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">in the widget's own dialog</text><rect x="450" y="150" width="300" height="70" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="470" y="193.0" font-family="IBM Plex Mono" font-size="17" fill="#0B8484" xml:space="preserve">1  allow="tools"</text><rect x="450" y="262" width="300" height="70" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="470" y="305.0" font-family="IBM Plex Mono" font-size="17" fill="#0B8484" xml:space="preserve">2  exposedTo</text><rect x="450" y="374" width="300" height="70" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="470" y="417.0" font-family="IBM Plex Mono" font-size="17" fill="#0B8484" xml:space="preserve">3  fromOrigins</text><line x1="390" y1="185" x2="446" y2="185" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><line x1="750" y1="185" x2="806" y2="185" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><line x1="806" y1="297" x2="754" y2="297" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><line x1="446" y1="297" x2="394" y2="297" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><line x1="390" y1="409" x2="446" y2="409" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><line x1="750" y1="409" x2="806" y2="409" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="600" y="120.0" font-family="Bricolage Grotesque" font-size="17" font-weight="700" text-anchor="middle" fill="#171A22" xml:space="preserve">all three must be open</text><text x="600" y="476.0" font-family="Literata" font-size="15" text-anchor="middle" fill="#5A6478" xml:space="preserve">(spec §6.3.4.1, two-sided opt-in)</text><rect x="30" y="525" width="1140" height="72" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="7 5"/><text x="52" y="557.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#C2468A" xml:space="preserve">partner.example</text><text x="52" y="583.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">embeds the same widget with allow="tools" and gets nothing: the widget never exposed a tool to it.</text></svg>