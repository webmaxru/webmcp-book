<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="775" fill="#FFFFFF"/><rect x="30" y="30" width="360" height="60" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="50" y="70.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#8F5A0C" xml:space="preserve">Agent</text><line x1="210" y1="90" x2="210" y2="700" stroke="#DCE1EC" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="420" y="30" width="360" height="60" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="440" y="70.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#0B8484" xml:space="preserve">Browser</text><line x1="600" y1="90" x2="600" y2="700" stroke="#DCE1EC" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="810" y="30" width="360" height="60" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="830" y="70.0" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#3F38D6" xml:space="preserve">Trailhead page</text><line x1="990" y1="90" x2="990" y2="700" stroke="#DCE1EC" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="50" y="120" width="320" height="92" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2.5"/><text x="66" y="150.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">may ask the user first:</text><text x="66" y="171.1" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">“Place this order for</text><text x="66" y="192.2" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">7,297 kr?”</text><line x1="210" y1="240" x2="596" y2="240" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="240" y="230.0" font-family="IBM Plex Mono" font-size="14" fill="#5A6478" xml:space="preserve">executeTool(checkout)</text><rect x="440" y="262" width="320" height="82" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2.5"/><text x="456" y="292.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">fires toolactivated, passes</text><text x="456" y="312.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">an AbortSignal, shows no</text><text x="456" y="332.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">consent UI of its own</text><line x1="600" y1="368" x2="986" y2="368" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="630" y="358.0" font-family="IBM Plex Mono" font-size="14" fill="#5A6478" xml:space="preserve">execute(input, { signal })</text><rect x="830" y="380" width="320" height="140" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="846" y="410.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#3F38D6" xml:space="preserve">Confirmation sheet</text><text x="846" y="436.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">exact lines and total,</text><text x="846" y="456.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">Oslo 0150, Visa ending 4242.</text><text x="846" y="476.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">Place order works only after</text><text x="846" y="496.0" font-family="Literata" font-size="15" fill="#171A22" xml:space="preserve">800 ms, on a trusted click</text><rect x="830" y="540" width="320" height="56" rx="9" fill="#5A54F0" stroke="#5A54F0" stroke-width="2.5"/><text x="990" y="574.0" font-family="Bricolage Grotesque" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">Person presses Place order</text><rect x="838" y="604" width="290" height="44" fill="#FFFFFF"/><text x="846" y="624.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">commit point: after the click,</text><text x="846" y="642.0" font-family="Literata" font-size="14" fill="#5A6478" xml:space="preserve">orders.place() runs to the end</text><line x1="986" y1="660" x2="214" y2="660" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="360" y="650.0" font-family="IBM Plex Mono" font-size="14" fill="#5A6478" xml:space="preserve">{ status: 'placed', orderId, total }</text><rect x="30" y="700" width="1140" height="52" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="7 5"/><text x="52" y="732.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">No party tells the others what it already asked (proposal: issue #155). Design for the user who sees only your sheet.</text></svg>