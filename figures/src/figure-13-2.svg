<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="620" fill="#FFFFFF"/><text x="30" y="44.0" font-family="Literata" font-size="16" fill="#C2468A" xml:space="preserve">Proposed in pull request #204 (open). Not in the specification, not in Chromium.</text><rect x="30" y="66" width="360" height="400" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><rect x="30" y="66" width="360" height="62" rx="14" fill="#5A54F0"/><text x="50" y="107.0" font-family="IBM Plex Mono" font-size="21" fill="#FFFFFF" xml:space="preserve">mode: "interactive"</text><text x="50" y="164.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#3F38D6" xml:space="preserve">The page draws the UI</text><text x="50" y="196.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">tool calls requestUserInput()</text><text x="50" y="218.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">with a callback that shows</text><text x="50" y="240.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">page UI. An agent holding</text><text x="50" y="262.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">keyboard and mouse yields.</text><text x="50" y="316.0" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" xml:space="preserve">Good for</text><text x="50" y="340.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">confirmations, choices</text><text x="50" y="362.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">the page already designs</text><line x1="210" y1="410" x2="210" y2="500" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="415" y="66" width="360" height="400" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><rect x="415" y="66" width="360" height="62" rx="14" fill="#B87613"/><text x="435" y="107.0" font-family="IBM Plex Mono" font-size="21" fill="#FFFFFF" xml:space="preserve">mode: "form"</text><text x="435" y="164.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#8F5A0C" xml:space="preserve">The agent draws the UI</text><text x="435" y="196.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">page sends requestedSchema:</text><text x="435" y="218.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">a flat object of primitives.</text><text x="435" y="240.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">The agent renders a form and</text><text x="435" y="262.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">returns what the user typed.</text><text x="435" y="316.0" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" xml:space="preserve">Good for</text><text x="435" y="340.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">a missing size, a</text><text x="435" y="362.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">delivery slot</text><line x1="595" y1="410" x2="595" y2="500" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="800" y="66" width="360" height="400" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><rect x="800" y="66" width="360" height="62" rx="14" fill="#0EA5A5"/><text x="820" y="107.0" font-family="IBM Plex Mono" font-size="21" fill="#FFFFFF" xml:space="preserve">mode: "url"</text><text x="820" y="164.0" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#0B8484" xml:space="preserve">The user visits a page</text><text x="820" y="196.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">agent shows a URL. Data never</text><text x="820" y="218.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">flows through the agent: the</text><text x="820" y="240.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">site picks up the result via</text><text x="820" y="262.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">its own backend.</text><text x="820" y="316.0" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" xml:space="preserve">Good for</text><text x="820" y="340.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">sign-in, payment,</text><text x="820" y="362.0" font-family="Literata" font-size="16" fill="#171A22" xml:space="preserve">anything secret</text><line x1="980" y1="410" x2="980" y2="500" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="505" width="1140" height="90" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2.5"/><text x="600" y="543.0" font-family="IBM Plex Mono" font-size="18" text-anchor="middle" fill="#171A22" xml:space="preserve">every mode resolves to  { action, content }</text><text x="600" y="575.0" font-family="Literata" font-size="16" text-anchor="middle" fill="#5A6478" xml:space="preserve">action: "accept" | "decline" | "cancel"   →   Trailhead today: placed | cancelled_by_user | aborted call</text></svg>