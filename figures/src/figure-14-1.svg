<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="746" viewBox="0 0 1200 746"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F38D6"/></marker></defs><rect width="1200" height="746" fill="#FFFFFF"/><text x="375" y="46" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start" xml:space="preserve">WHAT RUNS</text><text x="785" y="46" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start" xml:space="preserve">WHAT IT CATCHES</text><rect x="30" y="66" width="330" height="112" rx="14" fill="#F6F7FB"/><rect x="30" y="66" width="12" height="112" rx="6" fill="#3F38D6"/><text x="58" y="112" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Real-user measurement</text><text x="58" y="144" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">continuous · production</text><rect x="375" y="66" width="385" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="393" y="104" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">instrumentTool(): outcome, code and</text><text x="393" y="128" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">duration of every real call</text><text x="393" y="158" font-family="IBM Plex Mono" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Listing 14.8</text><rect x="775" y="66" width="305" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="793" y="112" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">What agents actually do on your site,</text><text x="793" y="136" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">and where they struggle</text><rect x="30" y="192" width="330" height="112" rx="14" fill="#F6F7FB"/><rect x="30" y="192" width="12" height="112" rx="6" fill="#B87613"/><text x="58" y="238" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Evals</text><text x="58" y="270" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">minutes · tokens · probabilistic</text><rect x="375" y="192" width="385" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="393" y="230" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">A model chooses the calls, trajectory</text><text x="393" y="254" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">and page checks score them</text><text x="393" y="284" font-family="IBM Plex Mono" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Listings 14.5–14.7</text><rect x="775" y="192" width="305" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="793" y="238" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">Descriptions models misread,</text><text x="793" y="262" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">regressions across models</text><rect x="30" y="318" width="330" height="112" rx="14" fill="#F6F7FB"/><rect x="30" y="318" width="12" height="112" rx="6" fill="#0EA5A5"/><text x="58" y="364" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Protocol tests</text><text x="58" y="396" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">seconds · deterministic</text><rect x="375" y="318" width="385" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="393" y="356" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">WebMCP DevTools domain: invokeTool,</text><text x="393" y="380" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">toolResponded, cancelInvocation</text><text x="393" y="410" font-family="IBM Plex Mono" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Listings 14.3–14.4</text><rect x="775" y="318" width="305" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="793" y="364" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">The call path a browser agent uses,</text><text x="793" y="388" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">plus the human step in your UI</text><rect x="30" y="444" width="330" height="112" rx="14" fill="#F6F7FB"/><rect x="30" y="444" width="12" height="112" rx="6" fill="#5A6478"/><text x="58" y="490" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Browser contract</text><text x="58" y="522" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">seconds · deterministic</text><rect x="375" y="444" width="385" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="393" y="482" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">Playwright with a mock and with</text><text x="393" y="506" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">Chromium + WebMCPTesting</text><text x="393" y="536" font-family="IBM Plex Mono" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">tests/rum.test.js</text><rect x="775" y="444" width="305" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="793" y="490" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">getTools(), executeTool(), result</text><text x="793" y="514" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">wrapping, error types, events</text><rect x="30" y="570" width="330" height="112" rx="14" fill="#F6F7FB"/><rect x="30" y="570" width="12" height="112" rx="6" fill="#5A54F0"/><text x="58" y="616" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Unit tests</text><text x="58" y="648" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">milliseconds · no browser</text><rect x="375" y="570" width="385" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="393" y="608" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">node:test, fakes, execute() called</text><text x="393" y="632" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">directly, time-travel sequences</text><text x="393" y="662" font-family="IBM Plex Mono" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Listings 14.1–14.2</text><rect x="775" y="570" width="305" height="112" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="793" y="616" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">Validation, error values, aborts,</text><text x="793" y="640" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">what the UI is told</text><line x1="1125" y1="672" x2="1125" y2="80" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="1158" y="374" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#5A6478" text-anchor="middle" transform="rotate(-90 1158 374)">closer to real users · slower · noisier</text><text x="30" y="724" font-family="Literata" font-size="16" font-style="italic" fill="#5A6478" text-anchor="start" xml:space="preserve">Run the bottom layers on every commit, the top ones nightly and in production.</text></svg>