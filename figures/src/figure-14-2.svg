<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F38D6"/></marker></defs><rect width="1200" height="940" fill="#FFFFFF"/><rect x="50" y="30" width="240" height="74" rx="14" fill="#B87613"/><text x="170" y="64" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Your test</text><text x="170" y="90" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">playing the agent</text><line x1="170" y1="104" x2="170" y2="790" stroke="#DCE1EC" stroke-width="3" stroke-dasharray="8 7"/><rect x="350" y="30" width="240" height="74" rx="14" fill="#0EA5A5"/><text x="470" y="64" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Chromium</text><text x="470" y="90" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">WebMCP DevTools domain</text><line x1="470" y1="104" x2="470" y2="790" stroke="#DCE1EC" stroke-width="3" stroke-dasharray="8 7"/><rect x="650" y="30" width="240" height="74" rx="14" fill="#5A54F0"/><text x="770" y="64" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Fjord Table</text><text x="770" y="90" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">the page and its tools</text><line x1="770" y1="104" x2="770" y2="790" stroke="#DCE1EC" stroke-width="3" stroke-dasharray="8 7"/><rect x="930" y="30" width="240" height="74" rx="14" fill="#3F38D6"/><text x="1050" y="64" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">The person</text><text x="1050" y="90" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">played by the test</text><line x1="1050" y1="104" x2="1050" y2="790" stroke="#DCE1EC" stroke-width="3" stroke-dasharray="8 7"/><line x1="170" y1="150" x2="462" y2="150" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="320.0" y="138" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">WebMCP.enable</text><line x1="470" y1="214" x2="178" y2="214" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="320.0" y="202" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">toolsAdded</text><text x="320.0" y="238" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle" xml:space="preserve">one event per tool, so wait for each by name</text><line x1="170" y1="300" x2="462" y2="300" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="320.0" y="288" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">invokeTool(book_table)</text><line x1="470" y1="364" x2="178" y2="364" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="320.0" y="352" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">{ invocationId }</text><text x="320.0" y="388" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle" xml:space="preserve">sent before any tool event</text><line x1="470" y1="450" x2="762" y2="450" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="620.0" y="438" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">execute(input, { signal })</text><text x="620.0" y="474" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle" xml:space="preserve">toolactivated fires on the page</text><rect x="600" y="494" width="340" height="60" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="770.0" y="522" font-family="Literata" font-size="15" fill="#171A22" text-anchor="middle" xml:space="preserve">opens its own confirmation dialog</text><text x="770.0" y="544" font-family="Literata" font-size="15" fill="#171A22" text-anchor="middle" xml:space="preserve">and waits for the person</text><line x1="170" y1="600" x2="1042" y2="600" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="610.0" y="588" font-family="Literata" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">click “Confirm booking”</text><line x1="1050" y1="660" x2="778" y2="660" stroke="#3F38D6" stroke-width="2.5" marker-end="url(#ahs)"/><text x="910.0" y="648" font-family="Literata" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">trusted click in the page’s UI</text><line x1="770" y1="720" x2="478" y2="720" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="620.0" y="708" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">{ status: "booked", … }</text><text x="620.0" y="744" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle" xml:space="preserve">execute resolves</text><line x1="470" y1="770" x2="178" y2="770" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="320.0" y="758" font-family="IBM Plex Mono" font-size="16" fill="#171A22" text-anchor="middle" xml:space="preserve">toolResponded</text><text x="320" y="800" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle" xml:space="preserve">status Completed, with the output</text><rect x="40" y="830" width="600" height="82" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="340.0" y="858" font-family="Literata" font-size="15" fill="#171A22" text-anchor="middle" xml:space="preserve">Cancel instead? cancelInvocation aborts the tool’s signal,</text><text x="340.0" y="880" font-family="Literata" font-size="15" fill="#171A22" text-anchor="middle" xml:space="preserve">the dialog closes, toolcancel fires on the page and</text><text x="340.0" y="902" font-family="Literata" font-size="15" fill="#171A22" text-anchor="middle" xml:space="preserve">toolResponded reports Canceled.</text><text x="1160" y="900" font-family="Literata" font-size="15" font-style="italic" fill="#5A6478" text-anchor="end" xml:space="preserve">Observed in Chromium 156, re-run on 2 November 2026.</text></svg>