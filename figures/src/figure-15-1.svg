iew filed</text><text x="176" y="428" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#171A22" text-anchor="end" xml:space="preserve">5 Aug 2026</text><circle cx="200" cy="422" r="8" fill="#C2468A"/><rect x="228" y="408" width="8" height="26" rx="3" fill="#C2468A"/><text x="248" y="428" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">Mozilla: position neutral. Issue #236 (generic function calls) follows</text><text x="176" y="466" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#171A22" text-anchor="end" xml:space="preserve">13 Aug 2026</text><circle cx="200" cy="460" r="8" fill="#B87613"/><rect x="228" y="446" width="8" height="26" rx="3" fill="#B87613"/><text x="248" y="466" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">WebML WG resolution, Apple warns of a formal objection</text><text x="176" y="504" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#171A22" text-anchor="end" xml:space="preserve">28 Sep 2026</text><circle cx="200" cy="498" r="8" fill="#0EA5A5"/><rect x="228" y="484" width="8" height="26" rx="3" fill="#0EA5A5"/><text x="248" y="504" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">Chrome origin trial extended through Chrome 162</text><text x="176" y="542" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#171A22" text-anchor="end" xml:space="preserve">28 Sep 2026</text><circle cx="200" cy="536" r="8" fill="#B87613"/><rect x="228" y="522" width="8" height="26" rx="3" fill="#B87613"/><text x="248" y="542" font-family="Literata" font-size="17" fill="#171A22" text-anchor="start" xml:space="preserve">Agentic Web WG charter proposed, WebML route dropped</text><text x="176" y="580" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#171A22" text-anchor="end" xml:space="preserve">1 Oct 2026</text><circl