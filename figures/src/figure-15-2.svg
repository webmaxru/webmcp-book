<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F38D6"/></marker></defs><rect width="1200" height="625" fill="#FFFFFF"/><rect x="30" y="170" width="250" height="250" rx="14" fill="#5A54F0"/><text x="155" y="222" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">WebMCP</text><text x="155" y="252" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Draft Community</text><text x="155" y="282" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Group Report</text><text x="155" y="330" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">27 October 2026</text><text x="155" y="352" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Web Machine Learning CG</text><text x="155" y="374" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">not on the</text><text x="155" y="396" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">standards track</text><text x="330" y="44" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#5A6478" text-anchor="start" xml:space="preserve">ROUTE</text><text x="810" y="44" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#5A6478" text-anchor="start" xml:space="preserve">WHAT IT MEANS FOR YOUR CODE</text><path d="M280,295 C 300,295 300,140 320,140" fill="none" stroke="#5A6478" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ah)"/><rect x="325" y="70" width="440" height="150" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2.5"/><rect x="325" y="70" width="12" height="150" rx="6" fill="#5A6478"/><text x="352" y="104" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#5A6478" text-anchor="start" xml:space="preserve">WebML Working Group</text><text x="352" y="134" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Charter pull request, 9 June 2026</text><text x="352" y="156" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Apple: “Expect a formal objection”</text><text x="352" y="178" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start" xml:space="preserve">Closed on 13 October 2026</text><line x1="770" y1="145" x2="795" y2="145" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="800" y="70" width="370" height="150" rx="14" fill="#F6F7FB"/><text x="820" y="110" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="start" xml:space="preserve">Nothing. This route is gone,</text><text x="820" y="134" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="start" xml:space="preserve">and the WebML WG stays on</text><text x="820" y="158" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="start" xml:space="preserve">machine learning inference.</text><text x="1150" y="202" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#C2468A" text-anchor="end" xml:space="preserve">closed</text><path d="M280,295 C 300,295 300,300 320,300" fill="none" stroke="#B87613" stroke-width="2.5" marker-end="url(#ah)"/><rect x="325" y="230" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><rect x="325" y="230" width="12" height="150" rx="6" fill="#B87613"/><text x="352" y="264" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Agentic Web Working Group</text><text x="352" y="294" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">Charter in refinement since 1 Oct</text><text x="352" y="316" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">(until about 10 Nov), then AC review</text><text x="352" y="338" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">“Site Capabilities for Agents”,</text><text x="352" y="360" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">initial input: the WebMCP spec</text><line x1="770" y1="305" x2="795" y2="305" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="800" y="230" width="370" height="150" rx="14" fill="#F6F7FB"/><text x="820" y="270" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">Nothing on charter day. Then TAG,</text><text x="820" y="294" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">accessibility and i18n review,</text><text x="820" y="318" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">and CR needs two independent</text><text x="820" y="342" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">interoperable implementations.</text><path d="M280,295 C 300,295 300,480 320,480" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#ah)"/><rect x="325" y="410" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><rect x="325" y="410" width="12" height="150" rx="6" fill="#0EA5A5"/><text x="352" y="444" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start" xml:space="preserve">Stays in the Community Group</text><text x="352" y="474" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">Charter delayed, or WebMCP left out</text><text x="352" y="496" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">Issue #236 may turn it into generic</text><text x="352" y="518" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">cross-environment function calls</text><text x="352" y="540" font-family="Literata" font-size="15" fill="#171A22" text-anchor="start" xml:space="preserve">with a second permissions policy</text><line x1="770" y1="485" x2="795" y2="485" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x="800" y="410" width="370" height="150" rx="14" fill="#F6F7FB"/><text x="820" y="450" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">A Chromium-only feature with no</text><text x="820" y="474" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">standards-track commitments.</text><text x="820" y="498" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">Tools survive, registration and</text><text x="820" y="522" font-family="Literata" font-size="16" fill="#171A22" text-anchor="start" xml:space="preserve">invocation code may change.</text><text x="30" y="600" font-family="Literata" font-size="15" font-style="italic" fill="#5A6478" text-anchor="start" xml:space="preserve">Routes as they look on 2 November 2026. In every case: thin tools over your own logic, feature detection, progressive enhancement.</text></svg>