<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs>
<rect x="0" y="0" width="1200" height="690" fill="#FFFFFF"/>
<rect x="40" y="30" width="520" height="300" rx="14" fill="#F6F7FB" stroke="#B87613" stroke-width="2.5"/>
<text x="70" y="74" font-family="Bricolage Grotesque" font-size="26" font-weight="800" fill="#8F5A0C" text-anchor="start">Backend MCP server</text>
<text x="70" y="102" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">available anywhere, any time, no UI</text>
