<rect x="40" y="580" width="1120" height="80" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="600" y="616" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="middle">Shared across both: one tool catalog, the same eval suites, the same owners</text>
