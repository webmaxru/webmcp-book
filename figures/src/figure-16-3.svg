<text x="90" y="231" font-family="IBM Plex Mono" font-size="19" font-weight="500" fill="#171A22" text-anchor="start">get_order_status</text>
<text x="70" y="300" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">“where is my order?” with the site closed</text>
