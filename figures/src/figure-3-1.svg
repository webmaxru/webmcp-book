r="middle" font-family="Literata" font-weight="400" font-size="16" fill="#171A22">Conversation,</text><text x="382" y="172" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#171A22">consent and</text><text x="382" y="194" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#171A22">security policy</text><rect x="300" y="265" width="195" height="70" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="397" y="298" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="19" fill="#8F5A0C">Client 1</text><text x="397" y="320" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">one connection</text><line x1="245" y1="220" x2="300" y2="300" stroke="#5A6478" stroke-width="2" stroke-dasharray="5 5"/><rect x="300" y="375" width="195" height="70" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="397" y="408" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="19" fill="#8F5A0C">Client 2</text><text x="397" y="430" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">one connection</text><line x1="245" y1="220" x2="300" y2="410" stroke="#5A6478" stroke-width="2" stroke-dasharray="5 5"/><rect x="300" y="485" width="195" height="70" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="397" y="518" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="19" fill="#8F5A0C">Client 3</text><text x="397" y="540" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">one connection</text><line x1="245" y1="220" x2="300" y2="520" stroke="#5A6478" stroke-width="2" stroke-dasharray="5 5"/><text x="140" y="300" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">one client</text><text x="140" y="322" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">per server</text><rect x="700" y="20" width="480" height="380" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="725" y="60" text-anchor="start" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#3F38D6">Trailhead MCP server</text><text x="725" y="86" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">our server from this chapter</text><rect x="725" y="110" width="430" height="56" rx="9" fill="#EEF1F8"/><text x="742" y="145" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#3F38D6">Tools</text><text x="845" y="145" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="15" fill="#171A22">search_products, get_order_status</text><rect x="725" y="178" width="430" height="56" rx="9" fill="#EEF1F8"/><text x="742" y="213" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#3F38D6">Resource</text><text x="845" y="213" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="15" fill="#171A22">trailhead://policies/returns</text><rect x="725" y="246" width="430" height="56" rx="9" fill="#EEF1F8"/><text x="742" y="281" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#3F38D6">Prompt</text><text x="845" y="281" text-anchor="start" font-family="IBM Plex Mono" font-weight="400" font-size="15" fill="#171A22">packing_list</text><rect x="725" y="330" width="430" height="54" rx="9" fill="#5A54F0"/><text x="940" y="353" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">Trailhead’s catalogue and</text><text x="940" y="373" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">order services</text><line x1="940" y1="304" x2="940" y2="326" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><rect x