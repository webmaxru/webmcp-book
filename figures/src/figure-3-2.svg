<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect x="20" y="20" width="570" height="640" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="305" y="60" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#171A22">Legacy: up to 2025-11-25</text><text x="305" y="86" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">a handshake opens a session</text><rect x="50" y="105" width="120" height="44" rx="9" fill="#B87613"/><text x="110" y="134" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#FFFFFF">Client</text><rect x="440" y="105" width="120" height="44" rx="9" fill="#5A54F0"/><text x="500" y="134" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#FFFFFF">Server</text><line x1="110" y1="149" x2="110" y2="580" stroke="#DCE1EC" stroke-width="2.5"/><line x1="500" y1="149" x2="500" y2="580" stroke="#DCE1EC" stroke-width="2.5"/><text x="305" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">initialize</text><line x1="110" y1="190" x2="500" y2="190" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="305" y="212" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">protocolVersion + client capabilities</text><text x="305" y="258" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">result</text><line x1="500" y1="268" x2="110" y2="268" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="305" y="290" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">server version + capabilities</text><text x="305" y="336" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">notifications/initialized</text><line x1="110" y1="346" x2="500" y2="346" stroke="#B87613" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aha)"/><rect x="50" y="380" width="510" height="34" rx="8" fill="#EEF1F8"/><text x="305" y="402" text-anchor="middle" font-family="Literata" font-weight="400" font-size="15" fill="#5A6478">session open: Mcp-Session-Id on HTTP</text><text x="305" y="442" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">tools/call</text><line x1="110" y1="452" x2="500" y2="452" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="305" y="474" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">depends on the session</text><text x="305" y="520" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">result</text><line x1="500" y1="530" x2="110" y2="530" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="305" y="615" text-anchor="middle" font-family="Literata" font-weight="400" font-size="15" fill="#5A6478">Later requests rely on state the handshake set up.</text><rect x="610" y="20" width="570" height="640" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="895" y="60" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="#171A22">Modern: 2026-07-28</text><text x="895" y="86" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">every request stands alone</text><rect x="640" y="105" width="120" height="44" rx="9" fill="#B87613"/><text x="700" y="134" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#FFFFFF">Client</text><rect x="1030" y="105" width="120" height="44" rx="9" fill="#5A54F0"/><text x="1090" y="134" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="18" fill="#FFFFFF">Server</text><line x1="700" y1="149" x2="700" y2="580" stroke="#DCE1EC" stroke-width="2.5"/><line x1="1090" y1="149" x2="1090" y2="580" stroke="#DCE1EC" stroke-width="2.5"/><text x="895" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">server/discover  (optional)</text><line x1="700" y1="190" x2="1090" y2="190" stroke="#B87613" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aha)"/><text x="895" y="236" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">result</text><line x1="1090" y1="246" x2="700" y2="246" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="895" y="268" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">versions + server capabilities</text><text x="895" y="314" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">tools/call + _meta</text><line x1="700" y1="324" x2="1090" y2="324" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="895" y="346" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">protocolVersion, clientInfo, clientCapabilities</text><text x="895" y="392" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">resultType: "input_required"</text><line x1="1090" y1="402" x2="700" y2="402" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="895" y="424" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">e.g. elicitation/create</text><text x="895" y="470" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">tools/call again, new id</text><line x1="700" y1="480" x2="1090" y2="480" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="895" y="502" text-anchor="middle" font-family="Literata" font-weight="400" font-size="14" fill="#5A6478">inputResponses + requestState</text><text x="895" y="548" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="15" fill="#171A22">resultType: "complete"</text><line x1="1090" y1="558" x2="700" y2="558" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="895" y="615" text-anchor="middle" font-family="Literata" font-weight="400" font-size="15" fill="#5A6478">Any server instance can answer any request.</text></svg>
