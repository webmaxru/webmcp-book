<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="620" fill="#FFFFFF"/><rect x="30" y="24" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><rect x="30" y="24" width="8" height="120" rx="4" fill="#5A54F0"/><text x="56" y="62" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Ingrid (the user)</text><text x="56" y="94" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">types one request,</text><text x="56" y="120" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">watches, confirms</text><rect x="30" y="310" width="260" height="190" rx="12" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><rect x="30" y="310" width="8" height="190" rx="4" fill="#B87613"/><text x="56" y="348" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Browser agent</text><text x="56" y="380" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">built-in assistant</text><text x="56" y="406" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">(or an in-page agent)</text><rect x="430" y="120" width="250" height="470" rx="12" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><rect x="430" y="120" width="8" height="470" rx="4" fill="#0EA5A5"/><text x="456" y="158" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">The browser</text><text x="456" y="190" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">mediates every call</text><text x="456" y="216" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">tracks each tool’s origin</text><text x="456" y="242" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">applies the “tools”</text><text x="456" y="268" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">permissions policy</text><text x="456" y="294" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">exposes tools to its</text><text x="456" y="320" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">agent in its own format</text><rect x="820" y="20" width="350" height="570" rx="14" fill="#F6F7FB" stroke="#5A54F0" stroke-width="2.5"/><text x="840" y="56" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Fjord Table tab</text><text x="840" y="82" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">fjordtable.example · the user’s live session</text><rect x="840" y="98" width="310" height="135" rx="12" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><rect x="840" y="98" width="8" height="135" rx="4" fill="#5A54F0"/><text x="866" y="136" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Registered tools</text><text x="866" y="158" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">search_availability</text><text x="866" y="184" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">book_table</text><rect x="840" y="282" width="310" height="108" rx="12" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><rect x="840" y="282" width="8" height="108" rx="4" fill="#5A54F0"/><text x="866" y="320" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Existing app code</text><text x="866" y="342" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">availability.search(…)</text><text x="866" y="366" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">bookingPanel.showSlots(…)</text><rect x="840" y="436" width="310" height="132" rx="12" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><rect x="840" y="436" width="8" height="132" rx="4" fill="#5A54F0"/><text x="866" y="474" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Visible booking UI</text><text x="866" y="506" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">slots appear on screen</text><text x="866" y="532" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">the normal confirm step</text><line x1="835" y1="150" x2="688" y2="150" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="700" cy="128" r="14" fill="#0EA5A5"/><text x="700" y="134" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="722" y="134" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Register</text><line x1="684" y1="210" x2="832" y2="210" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="700" cy="188" r="14" fill="#0EA5A5"/><text x="700" y="194" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="722" y="194" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Invoke</text><line x1="995" y1="236" x2="995" y2="276" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="1025" cy="256" r="14" fill="#5A54F0"/><text x="1025" y="262" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1047" y="262" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Execute</text><line x1="835" y1="345" x2="688" y2="345" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="700" cy="323" r="14" fill="#0EA5A5"/><text x="700" y="329" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="722" y="329" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Respond</text><line x1="995" y1="393" x2="995" y2="430" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><line x1="292" y1="350" x2="420" y2="350" stroke="#5A6478" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><circle cx="305" cy="328" r="14" fill="#B87613"/><text x="305" y="334" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="327" y="334" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Discover</text><line x1="292" y1="415" x2="420" y2="415" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="305" cy="393" r="14" fill="#B87613"/><text x="305" y="399" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="327" y="399" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Invoke</text><line x1="426" y1="475" x2="300" y2="475" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="305" cy="453" r="14" fill="#B87613"/><text x="305" y="459" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="327" y="459" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">Respond</text><line x1="140" y1="148" x2="140" y2="302" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><line x1="170" y1="306" x2="170" y2="152" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><line x1="815" y1="55" x2="302" y2="55" stroke="#5A54F0" stroke-width="2.5" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="550" y="42" font-family="Literata" font-size="17" font-weight="400" fill="#5A54F0" text-anchor="middle">sees the same page, stays in control</text></svg>