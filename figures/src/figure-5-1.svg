<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="1020" fill="#FFFFFF"/><rect x="10" y="855" width="1180" height="140" rx="12" fill="#EEF1F8"/><rect x="10" y="465" width="1180" height="375" rx="12" fill="#F6F7FB"/><rect x="10" y="345" width="1180" height="105" rx="12" fill="#EEF1F8"/><rect x="10" y="130" width="1180" height="200" rx="12" fill="#F6F7FB"/><rect x="30" y="30" width="340" height="78" rx="14" fill="#5A54F0" stroke="#5A54F0" stroke-width="2"/><text x="200" y="66" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your page</text><text x="200" y="94" font-family="Literata" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">document + your code</text><line x1="200" y1="112" x2="200" y2="1010" stroke="#5A54F0" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/><rect x="430" y="30" width="340" height="78" rx="14" fill="#0EA5A5" stroke="#0EA5A5" stroke-width="2"/><text x="600" y="66" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Browser</text><text x="600" y="94" font-family="Literata" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">tool map</text><line x1="600" y1="112" x2="600" y2="1010" stroke="#0EA5A5" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/><rect x="830" y="30" width="340" height="78" rx="14" fill="#B87613" stroke="#B87613" stroke-width="2"/><text x="1000" y="66" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agent</text><text x="1000" y="94" font-family="Literata" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">browser agent or in-page agent</text><line x1="1000" y1="112" x2="1000" y2="1010" stroke="#B87613" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/><text x="24" y="158" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start">Register</text><text x="24" y="373" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start">Discover</text><text x="24" y="493" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start">Call</text><text x="24" y="883" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#5A6478" text-anchor="start">Unregister</text><line x1="208" y1="175" x2="588" y2="175" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="161" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">registerTool(tool, { signal })</text><text x="400.0" y="201" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">checks name, description, permission, state</text><rect x="435.0" y="215" width="330" height="62" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="600" y="243" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="middle">inputSchema → JSON string</text><text x="600" y="265" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">stored as a snapshot</text><line x1="608" y1="310" x2="988" y2="310" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="800.0" y="296" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">toolchange</text><line x1="592" y1="310" x2="212" y2="310" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="296" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">promise resolves</text><line x1="608" y1="400" x2="988" y2="400" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="800.0" y="386" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">name, title, description, schema</text><text x="800.0" y="426" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">read by the agent to choose a tool</text><line x1="992" y1="510" x2="612" y2="510" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="800.0" y="496" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">arguments as a JSON string</text><text x="800.0" y="536" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">not an object, not a live value</text><rect x="435.0" y="550" width="330" height="62" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="600" y="578" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="middle">parse → plain object</text><text x="600" y="600" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">not an object: DataError</text><line x1="592" y1="650" x2="212" y2="650" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="636" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">execute(input, { signal })</text><text x="400.0" y="676" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">toolactivated fires, one AbortController per call</text><rect x="50.0" y="690" width="300" height="62" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="200" y="718" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="middle">your code runs</text><text x="200" y="740" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">updates the UI, then returns</text><line x1="208" y1="780" x2="588" y2="780" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="766" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">return value</text><text x="400.0" y="806" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">JSON.stringify(), undefined fails in the draft</text><line x1="608" y1="820" x2="988" y2="820" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="800.0" y="806" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">result as a JSON string</text><line x1="208" y1="900" x2="588" y2="900" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="886" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">controller.abort()</text><text x="400.0" y="926" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">tool removed, running calls continue</text><line x1="608" y1="965" x2="988" y2="965" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="800.0" y="951" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">toolchange</text></svg>