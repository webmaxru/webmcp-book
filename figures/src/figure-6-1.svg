<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" width="1200" height="768"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="768" fill="#FFFFFF"/><text x="40" y="62" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Tool</text><text x="905" y="62" font-family="Bricolage Grotesque" font-size="24" font-weight="700" fill="#171A22" text-anchor="start">Why</text><text x="395" y="50" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#0EA5A5" text-anchor="middle">readOnly</text><text x="395" y="74" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#0EA5A5" text-anchor="middle">Hint</text><text x="545" y="50" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#C2468A" text-anchor="middle">untrusted</text><text x="545" y="74" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#C2468A" text-anchor="middle">ContentHint</text><text x="695" y="50" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#B87613" text-anchor="middle">consequential</text><text x="695" y="74" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#B87613" text-anchor="middle">Hint</text><text x="835" y="50" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#5A6478" text-anchor="middle">debugging</text><line x1="40" y1="96" x2="1160" y2="96" stroke="#5A6478" stroke-width="2"/><rect x="30" y="112" width="1140" height="74" rx="9" fill="#F6F7FB" stroke="none" stroke-width="0"/><text x="46" y="156.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">search_products</text><circle cx="395" cy="149.0" r="15" fill="#0EA5A5"/><path d="M388,149.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="545" cy="149.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="149.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="149.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="145.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Reads Trailhead’s own catalogue.</text><text x="905" y="167.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Showing results changes nothing.</text><text x="46" y="230.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">compare_products</text><circle cx="395" cy="223.0" r="15" fill="#0EA5A5"/><path d="M388,223.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="545" cy="223.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="223.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="223.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="219.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Reads specs, may take seconds.</text><text x="905" y="241.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Still changes nothing.</text><rect x="30" y="260" width="1140" height="74" rx="9" fill="#F6F7FB" stroke="none" stroke-width="0"/><text x="46" y="304.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">get_cart</text><circle cx="395" cy="297.0" r="15" fill="#0EA5A5"/><path d="M388,297.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="545" cy="297.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="297.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="297.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="293.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">A cheap way for the agent</text><text x="905" y="315.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">to look at the state again.</text><text x="46" y="378.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">get_product_reviews</text><circle cx="395" cy="371.0" r="15" fill="#0EA5A5"/><path d="M388,371.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="545" cy="371.0" r="15" fill="#C2468A"/><path d="M538,371.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="695" cy="371.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="371.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="367.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Reads, but the text is written</text><text x="905" y="389.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">by customers, not by Trailhead.</text><rect x="30" y="408" width="1140" height="74" rx="9" fill="#F6F7FB" stroke="none" stroke-width="0"/><text x="46" y="452.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">add_to_cart</text><circle cx="395" cy="445.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="545" cy="445.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="445.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="445.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="441.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Writes, but cheap and reversible:</text><text x="905" y="463.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">no hint is the honest answer.</text><text x="46" y="526.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">checkout</text><circle cx="395" cy="519.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="545" cy="519.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="519.0" r="15" fill="#B87613"/><path d="M688,519.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="835" cy="519.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="905" y="515.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Can’t be taken back. Confirmed</text><text x="905" y="537.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">in Trailhead’s own dialog anyway.</text><rect x="30" y="556" width="1140" height="74" rx="9" fill="#F6F7FB" stroke="none" stroke-width="0"/><text x="46" y="600.0" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#171A22" text-anchor="start">debug_dump_cart_state</text><circle cx="395" cy="593.0" r="15" fill="#0EA5A5"/><path d="M388,593.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><circle cx="545" cy="593.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="695" cy="593.0" r="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><circle cx="835" cy="593.0" r="15" fill="#5A6478"/><path d="M828,593.0 l5,6 l10,-12" stroke="#FFFFFF" stroke-width="3" fill="none"/><text x="905" y="589.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">For developer tooling only.</text><text x="905" y="611.0" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Registered in dev builds only.</text><circle cx="52" cy="674" r="12" fill="#5A54F0"/><path d="M46,674 l4,5 l8,-10" stroke="#FFFFFF" stroke-width="3" fill="none"/><text x="74" y="680" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">hint set to true</text><circle cx="270" cy="674" r="8" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2.5"/><text x="288" y="680" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">left at its default, false</text><text x="40" y="724" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Hints inform the agent. The browser doesn’t check them, and the page still enforces its own rules.</text></svg>