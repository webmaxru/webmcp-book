<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="900" fill="#FFFFFF"/><text x="930" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#C2468A" text-anchor="start">If this step fails</text><text x="930" y="72" font-family="Bricolage Grotesque" font-size="16" font-weight="500" fill="#5A6478" text-anchor="start">(the draft’s exception names)</text><rect x="40" y="30" width="250" height="6" rx="3" fill="#B87613"/><text x="40" y="66" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#B87613" text-anchor="start">Agent</text><rect x="310" y="30" width="330" height="6" rx="3" fill="#0EA5A5"/><text x="310" y="66" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#0EA5A5" text-anchor="start">Browser</text><rect x="660" y="30" width="250" height="6" rx="3" fill="#5A54F0"/><text x="660" y="66" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#5A54F0" text-anchor="start">Your page</text><rect x="40" y="100" width="250" height="70" rx="10" fill="#F6F7FB" stroke="#B87613" stroke-width="2.5"/><text x="58" y="130" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">1  Calls the tool</text><text x="58" y="155" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">with JSON arguments</text><path d="M165.0,170 L165.0,181 L475.0,181 L475.0,188" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="296" y1="135" x2="920" y2="135" stroke="#C2468A" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="104" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="939" y="130" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#C2468A" text-anchor="start">Signal already aborted:</text><text x="939" y="153" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">AbortError, nothing runs</text><rect x="310" y="192" width="330" height="70" rx="10" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="2.5"/><text x="328" y="222" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">2  Finds the name</text><text x="328" y="247" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">in the document’s tool map</text><line x1="475.0" y1="262" x2="475.0" y2="282" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="646" y1="227" x2="920" y2="227" stroke="#C2468A" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="196" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="939" y="222" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#C2468A" text-anchor="start">No such tool:</text><text x="939" y="245" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">NotFoundError</text><rect x="310" y="284" width="330" height="70" rx="10" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="2.5"/><text x="328" y="314" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">3  Parses the arguments</text><text x="328" y="339" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">into a fresh object</text><line x1="475.0" y1="354" x2="475.0" y2="374" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="646" y1="319" x2="920" y2="319" stroke="#C2468A" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="288" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="939" y="314" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#C2468A" text-anchor="start">Can’t parse into an object:</text><text x="939" y="337" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">DataError</text><rect x="310" y="376" width="330" height="70" rx="10" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="2.5"/><text x="328" y="406" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">4  Fires toolactivated,</text><text x="328" y="431" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">creates the call’s signal</text><path d="M475.0,446 L475.0,457 L785.0,457 L785.0,464" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="646" y1="411" x2="920" y2="411" stroke="#0EA5A5" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="380" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2"/><text x="939" y="406" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#0EA5A5" text-anchor="start">Not a failure: Chromium 156</text><text x="939" y="429" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">fires it after execute (#332)</text><rect x="660" y="468" width="250" height="70" rx="10" fill="#F6F7FB" stroke="#5A54F0" stroke-width="2.5"/><text x="678" y="498" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">5  execute(input,</text><text x="678" y="523" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">{ signal }) runs</text><path d="M785.0,538 L785.0,549 L475.0,549 L475.0,556" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="916" y1="503" x2="920" y2="503" stroke="#C2468A" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="472" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="939" y="498" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#C2468A" text-anchor="start">Throws or rejects:</text><text x="939" y="521" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">OperationError, name only</text><rect x="310" y="560" width="330" height="70" rx="10" fill="#F6F7FB" stroke="#0EA5A5" stroke-width="2.5"/><text x="328" y="590" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">6  JSON-serializes</text><text x="328" y="615" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">the return value</text><path d="M475.0,630 L475.0,641 L165.0,641 L165.0,648" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><line x1="646" y1="595" x2="920" y2="595" stroke="#C2468A" stroke-width="2" stroke-dasharray="6 6"/><rect x="925" y="564" width="250" height="62" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="939" y="590" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#C2468A" text-anchor="start">Can’t serialize:</text><text x="939" y="613" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">OperationError</text><rect x="40" y="652" width="250" height="70" rx="10" fill="#F6F7FB" stroke="#B87613" stroke-width="2.5"/><text x="58" y="682" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="start">7  Receives</text><text x="58" y="707" font-family="Bricolage Grotesque" font-size="18" font-weight="500" fill="#5A6478" text-anchor="start">the result string</text><rect x="40" y="752" width="1135" height="120" rx="10" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><text x="60" y="788" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">At any point after step 4</text><text x="60" y="820" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">The agent aborts its signal: the call rejects with AbortError at once, your signal fires, toolcancel follows (Figure 6.3).</text><text x="60" y="848" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">The page unloads: the call rejects, and Chromium 156 reports UnknownError where the draft says AbortError.</text></svg>