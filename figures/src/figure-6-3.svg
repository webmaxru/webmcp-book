<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="40" y="48" font-family="Bricolage Grotesque" font-size="18" font-weight="600" fill="#5A6478" text-anchor="start">time</text><line x1="90" y1="42" x2="1160" y2="42" stroke="#5A6478" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="90" width="1130" height="150" rx="10" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="60" y="124" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#B87613" text-anchor="start">Agent (caller)</text><rect x="40" y="300" width="1130" height="180" rx="10" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="60" y="334" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#5A54F0" text-anchor="start">Your tool (execute)</text><line x1="140" y1="180" x2="470" y2="180" stroke="#B87613" stroke-width="8" stroke-linecap="round"/><text x="140" y="160" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">executeTool() pending</text><circle cx="470" cy="180" r="10" fill="#C2468A"/><text x="470" y="215" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#C2468A" text-anchor="middle">abort()</text><text x="500" y="166" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Promise rejects with AbortError right away.</text><text x="500" y="188" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">The agent moves on and never sees the tool’s result.</text><line x1="160" y1="390" x2="780" y2="390" stroke="#5A54F0" stroke-width="8" stroke-linecap="round"/><text x="160" y="370" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">execute(input, { signal }) running</text><line x1="780" y1="390" x2="1000" y2="390" stroke="#DCE1EC" stroke-width="6" stroke-dasharray="10 8"/><line x1="470" y1="195" x2="488" y2="372" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arm)"/><circle cx="490" cy="390" r="10" fill="#C2468A"/><text x="470" y="428" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#C2468A" text-anchor="start">signal aborted,</text><text x="470" y="450" font-family="Bricolage Grotesque" font-size="16" font-weight="600" fill="#C2468A" text-anchor="start">toolcancel fired</text><rect x="777" y="368" width="6" height="44" fill="#0EA5A5"/><text x="780" y="346" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#0EA5A5" text-anchor="middle">commit point</text><text x="700" y="428" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#0EA5A5" text-anchor="start">signal.throwIfAborted()</text><text x="700" y="450" font-family="Bricolage Grotesque" font-size="15" font-weight="500" fill="#171A22" text-anchor="start">throws here, nothing committed</text><circle cx="1000" cy="390" r="10" fill="#FFFFFF" stroke="#5A6478" stroke-width="3"/><text x="1000" y="346" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#5A6478" text-anchor="middle">without the check:</text><text x="1000" y="428" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#5A6478" text-anchor="middle">work finishes,</text><text x="1000" y="450" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#5A6478" text-anchor="middle">result discarded</text><rect x="40" y="500" width="1130" height="110" rx="10" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><text x="60" y="536" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">Cancelling doesn’t stop your code.</text><text x="60" y="566" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">The browser only rejects the caller’s promise and aborts your signal. Check the signal before every step</text><text x="60" y="590" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">that can’t be undone, and remember the work may already have finished when the cancel arrives.</text></svg>