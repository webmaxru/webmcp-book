<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="770" fill="#FFFFFF"/><rect x="40" y="24" width="1130" height="74" rx="10" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2.5"/><text x="60" y="58" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#0EA5A5" text-anchor="start">Browser agent</text><text x="60" y="84" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Observes every frame’s tools, labelled by origin. Only gate 1 applies to it.</text><line x1="605" y1="98" x2="605" y2="128" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="130" width="1130" height="600" rx="12" fill="#F6F7FB" stroke="#5A54F0" stroke-width="2.5"/><text x="60" y="166" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#5A54F0" text-anchor="start">Top-level document</text><text x="300" y="166" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="start">https://app.ledgerly.example</text><rect x="60" y="186" width="360" height="150" rx="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="80" y="218" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="start">ModelContext</text><text x="80" y="250" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">find_invoice</text><text x="80" y="282" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">exposedTo: Supportly’s origin</text><text x="80" y="306" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">(so the widget can call it too)</text><rect x="60" y="356" width="360" height="150" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2.5"/><text x="80" y="390" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#B87613" text-anchor="start">Ledgerly’s in-page agent</text><text x="80" y="422" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">getTools({ fromOrigins:</text><text x="80" y="446" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">  [Supportly] })</text><text x="80" y="478" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">executeTool(tool, input)</text><rect x="60" y="530" width="360" height="180" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2"/><text x="80" y="562" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0EA5A5" text-anchor="start">Gate 1 — the embedder</text><text x="80" y="592" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">Permissions-Policy header:</text><text x="80" y="616" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">tools=(self "https://widget.…")</text><text x="80" y="640" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">and allow="tools" on the iframe</text><text x="80" y="692" font-family="Literata" font-size="16" font-weight="400" fill="#C2468A" text-anchor="start">Missing: NotAllowedError</text><rect x="470" y="186" width="680" height="524" rx="12" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5" stroke-dasharray="8 6"/><text x="492" y="220" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#5A54F0" text-anchor="start">&lt;iframe allow="tools"&gt;</text><text x="492" y="248" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="start">https://widget.supportly.example</text><rect x="492" y="270" width="636" height="190" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><text x="512" y="302" font-family="IBM Plex Mono" font-size="18" font-weight="600" fill="#171A22" text-anchor="start">ModelContext</text><text x="512" y="336" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">search_articles</text><text x="512" y="366" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">get_ticket_status</text><text x="512" y="396" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">create_ticket</text><text x="760" y="336" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#0EA5A5" text-anchor="start">readOnlyHint</text><text x="760" y="366" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#0EA5A5" text-anchor="start">readOnlyHint, untrustedContentHint</text><text x="760" y="396" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#B87613" text-anchor="start">consequentialHint</text><text x="512" y="438" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">registerTool(tool, { exposedTo: [Ledgerly] })</text><rect x="492" y="480" width="300" height="210" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="510" y="512" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#5A54F0" text-anchor="start">Gate 2 — the provider</text><text x="510" y="542" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">exposedTo lists the origins</text><text x="510" y="566" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">that may see and call</text><text x="510" y="590" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">each tool.</text><text x="510" y="614" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Missing: tool is invisible.</text><rect x="812" y="480" width="316" height="210" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="830" y="512" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#B87613" text-anchor="start">Gate 3 — the consumer</text><text x="830" y="542" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">fromOrigins lists the origins</text><text x="830" y="566" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">the agent wants tools from.</text><text x="830" y="590" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Same-origin is always in.</text><text x="830" y="614" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">Missing: tool is invisible.</text><path d="M420,430 C450,430 450,380 488,380" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ar)"/><text x="605" y="752" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle">All three must say yes (spec §6.3.4, two-sided opt-in). Same-origin frames need none of gates 2 and 3.</text></svg>