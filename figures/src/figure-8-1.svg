<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect width="1200" height="812" fill="#FFFFFF"/><rect x="30" y="30" width="500" height="74" rx="14" fill="#5A54F0"/><text x="52" y="64" font-family="Bricolage Grotesque" font-weight="700" font-size="26" fill="#FFFFFF">In your HTML</text><text x="52" y="91" font-family="Literata" font-size="17" fill="#FFFFFF">the form a person already uses</text><rect x="640" y="30" width="530" height="74" rx="14" fill="#B87613"/><text x="662" y="64" font-family="Bricolage Grotesque" font-weight="700" font-size="26" fill="#FFFFFF">What the agent receives</text><text x="662" y="91" font-family="Literata" font-size="17" fill="#FFFFFF">the tool definition, as getTools() returns it</text><rect x="30" y="122" width="500" height="480" rx="14" fill="#10141F"/><rect x="640" y="122" width="530" height="480" rx="14" fill="#10141F"/><text x="48" y="150" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">&lt;form <tspan fill="#9E98FF">toolname</tspan>=<tspan fill="#7FD0A6">"search_availability"</tspan></text><text x="48" y="180" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">      <tspan fill="#9E98FF">tooldescription</tspan>=<tspan fill="#7FD0A6">"Find open tables…"</tspan></text><text x="48" y="210" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">      toolautosubmit&gt;</text><text x="48" y="240" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;label&gt;Date&lt;/label&gt;</text><text x="48" y="270" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;input <tspan fill="#9E98FF">name</tspan>=<tspan fill="#7FD0A6">"date"</tspan> <tspan fill="#9E98FF">type</tspan>=<tspan fill="#7FD0A6">"date"</tspan> required&gt;</text><text x="48" y="300" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;label&gt;Preferred time&lt;/label&gt;</text><text x="48" y="330" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;input <tspan fill="#9E98FF">name</tspan>=<tspan fill="#7FD0A6">"time"</tspan> <tspan fill="#9E98FF">type</tspan>=<tspan fill="#7FD0A6">"time"</tspan></text><text x="48" y="360" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">toolparamdescription</tspan>=<tspan fill="#7FD0A6">"Preferred time…"</tspan>&gt;</text><text x="48" y="390" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;label&gt;Guests&lt;/label&gt;</text><text x="48" y="420" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;input <tspan fill="#9E98FF">name</tspan>=<tspan fill="#7FD0A6">"partySize"</tspan> <tspan fill="#9E98FF">type</tspan>=<tspan fill="#7FD0A6">"number"</tspan></text><text x="48" y="450" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">min</tspan>=<tspan fill="#7FD0A6">"1"</tspan> <tspan fill="#9E98FF">max</tspan>=<tspan fill="#7FD0A6">"12"</tspan> required&gt;</text><text x="48" y="480" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">  &lt;select <tspan fill="#9E98FF">name</tspan>=<tspan fill="#7FD0A6">"seating"</tspan>&gt;</text><text x="48" y="510" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">    &lt;option <tspan fill="#9E98FF">value</tspan>=<tspan fill="#7FD0A6">"window"</tspan>&gt;By the window</text><text x="48" y="540" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">    …</text><text x="48" y="570" font-family="IBM Plex Mono" font-size="15" fill="#E6EAF6" xml:space="preserve">&lt;/form&gt;</text><text x="656" y="150" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve"><tspan fill="#9E98FF">name</tspan>: <tspan fill="#7FD0A6">"search_availability"</tspan></text><text x="656" y="180" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve"><tspan fill="#9E98FF">description</tspan>: <tspan fill="#7FD0A6">"Find open tables…"</tspan></text><text x="656" y="210" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">annotation (DevTools Protocol): autosubmit</text><text x="656" y="240" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve"><tspan fill="#9E98FF">inputSchema.properties</tspan>:</text><text x="656" y="270" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">  <tspan fill="#9E98FF">date</tspan>: type <tspan fill="#7FD0A6">"string"</tspan>, format <tspan fill="#7FD0A6">"date"</tspan>,</text><text x="656" y="300" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">description</tspan>: <tspan fill="#7FD0A6">"Date (Dates MUST be …)"</tspan></text><text x="656" y="330" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">  <tspan fill="#9E98FF">time</tspan>: type <tspan fill="#7FD0A6">"string"</tspan>,</text><text x="656" y="360" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">format</tspan>: <tspan fill="#7FD0A6">"^([01][0-9]|2[0-3]):…$"</tspan>,</text><text x="656" y="390" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">description</tspan>: <tspan fill="#7FD0A6">"Preferred time…"</tspan></text><text x="656" y="420" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">  <tspan fill="#9E98FF">partySize</tspan>: type <tspan fill="#7FD0A6">"number"</tspan>,</text><text x="656" y="450" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">    <tspan fill="#9E98FF">minimum</tspan>: <tspan fill="#E7B23D">1</tspan>, <tspan fill="#9E98FF">maximum</tspan>: <tspan fill="#E7B23D">12</tspan>, <tspan fill="#9E98FF">multipleOf</tspan>: <tspan fill="#E7B23D">1</tspan></text><text x="656" y="480" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">  <tspan fill="#9E98FF">seating</tspan>: enum [<tspan fill="#7FD0A6">""</tspan>, <tspan fill="#7FD0A6">"window"</tspan>, …],</text><text x="656" y="510" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">    anyOf [ const <tspan fill="#7FD0A6">"window"</tspan>,</text><text x="656" y="540" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve">           title <tspan fill="#7FD0A6">"By the window"</tspan> ], …</text><text x="656" y="570" font-family="IBM Plex Mono" font-size="14.5" fill="#E6EAF6" xml:space="preserve"><tspan fill="#9E98FF">inputSchema.required</tspan>: [<tspan fill="#7FD0A6">"date"</tspan>, <tspan fill="#7FD0A6">"partySize"</tspan>]</text><path d="M532,145 C585,145 585,145 636,145" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,175 C585,175 585,175 636,175" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,205 C585,205 585,205 636,205" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,235 C585,235 585,295 636,295" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,265 C585,265 585,265 636,265" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,355 C585,355 585,385 636,385" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,445 C585,445 585,445 636,445" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,505 C585,505 585,505 636,505" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><path d="M532,445 C585,445 585,565 636,565" fill="none" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="585" y="112" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#0EA5A5">browser</text><rect x="30" y="632" width="1140" height="150" rx="14" fill="#F6F7FB" stroke="#DCE1EC"/><text x="52" y="670" font-family="Bricolage Grotesque" font-weight="700" font-size="21" fill="#171A22">Not in the schema</text><text x="52" y="702" font-family="Literata" font-size="18" fill="#171A22">Left out: <tspan font-family="IBM Plex Mono" font-size="16">disabled</tspan>, <tspan font-family="IBM Plex Mono" font-size="16">readonly</tspan>, <tspan font-family="IBM Plex Mono" font-size="16">type="hidden"</tspan>, <tspan font-family="IBM Plex Mono" font-size="16">type="file"</tspan>, form-associated custom elements.</text><text x="52" y="732" font-family="Literata" font-size="18" fill="#171A22">Dropped: <tspan font-family="IBM Plex Mono" font-size="16">minlength</tspan> and <tspan font-family="IBM Plex Mono" font-size="16">maxlength</tspan> (still enforced when the form is submitted). Titles stay empty.</text><text x="52" y="762" font-family="Literata" font-style="italic" font-size="16" fill="#5A6478">Observed in Chromium 156.0.8078.4 with WebMCPTesting. Not specified anywhere: check getTools() after each Chrome update.</text></svg>