<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010"><rect width="1200" height="1010" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0EA5A5"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87613"/></marker>
<marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A54F0"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2468A"/></marker></defs><rect x="190" y="30" width="220" height="64" rx="12" fill="#3F38D6"/><text x="300" y="59" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="23" fill="#FFFFFF">Person</text><text x="300" y="82" text-anchor="middle" font-family="Literata" font-size="15" fill="#FFFFFF">checks and confirms</text><rect x="435" y="30" width="220" height="64" rx="12" fill="#EEF1F8" stroke="#5A54F0" stroke-width="2"/><text x="545" y="59" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="23" fill="#3F38D6">Your page</text><text x="545" y="82" text-anchor="middle" font-family="Literata" font-size="15" fill="#3F38D6">form + submit handler</text><rect x="680" y="30" width="220" height="64" rx="12" fill="#0EA5A5"/><text x="790" y="59" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="23" fill="#FFFFFF">Browser</text><text x="790" y="82" text-anchor="middle" font-family="Literata" font-size="15" fill="#FFFFFF">synthesizes, fills, submits</text><rect x="925" y="30" width="220" height="64" rx="12" fill="#B87613"/><text x="1035" y="59" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="23" fill="#FFFFFF">Agent</text><text x="1035" y="82" text-anchor="middle" font-family="Literata" font-size="15" fill="#FFFFFF">browser or in-page</text><line x1="300" y1="94" x2="300" y2="985" stroke="#DCE1EC" stroke-width="2.5"/><line x1="545" y1="94" x2="545" y2="985" stroke="#DCE1EC" stroke-width="2.5"/><line x1="790" y1="94" x2="790" y2="985" stroke="#DCE1EC" stroke-width="2.5"/><line x1="1035" y1="94" x2="1035" y2="985" stroke="#DCE1EC" stroke-width="2.5"/><rect x="20" y="133" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="156" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">1 Discover</text><line x1="790" y1="150" x2="1027" y2="150" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="912.5" y="140" text-anchor="middle" font-family="IBM Plex Mono" font-size="14.5" fill="#171A22">name, description, schema</text><text x="912.5" y="172" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">synthesized from the form</text><rect x="20" y="213" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="236" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">2 Call</text><line x1="1035" y1="230" x2="798" y2="230" stroke="#B87613" stroke-width="2.5" marker-end="url(#aha)"/><text x="912.5" y="220" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">arguments</text><text x="912.5" y="252" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">unknown or invalid value → error</text><rect x="20" y="293" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="316" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">3 Fill</text><line x1="790" y1="310" x2="553" y2="310" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="667.5" y="300" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">fields filled</text><text x="667.5" y="332" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">trusted input + change events</text><rect x="440.0" y="350" width="330" height="58" rx="9" fill="#F6F7FB" stroke="#DCE1EC"/><text x="605" y="374" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#171A22">toolactivated at modelContext</text><text x="605" y="396" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#171A22">:tool-form-active, focus on submit</text><rect x="20" y="448" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="471" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">4 Submit</text><line x1="300" y1="465" x2="537" y2="465" stroke="#3F38D6" stroke-width="2.5" marker-end="url(#ahi)"/><text x="422.5" y="455" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">presses Submit</text><text x="422.5" y="487" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">without toolautosubmit</text><line x1="790" y1="540" x2="553" y2="540" stroke="#0EA5A5" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#aht)"/><text x="667.5" y="530" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">submits the form</text><text x="667.5" y="562" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">toolautosubmit: validation first</text><rect x="440.0" y="585" width="330" height="58" rx="9" fill="#F6F7FB" stroke="#DCE1EC"/><text x="605" y="609" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#171A22">submit: agentInvoked === true</text><text x="605" y="631" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#171A22">preventDefault(), respondWith(p)</text><rect x="20" y="683" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="706" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">5 Respond</text><line x1="545" y1="700" x2="782" y2="700" stroke="#5A54F0" stroke-width="2.5" marker-end="url(#ahi)"/><text x="667.5" y="690" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">resolved value</text><text x="667.5" y="722" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">or navigate → next page’s JSON-LD</text><line x1="790" y1="775" x2="1027" y2="775" stroke="#0EA5A5" stroke-width="2.5" marker-end="url(#aht)"/><text x="912.5" y="765" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">result</text><text x="912.5" y="797" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">object, string or JSON-LD array</text><rect x="20" y="843" width="130" height="34" rx="17" fill="#F6F7FB" stroke="#DCE1EC"/><text x="85" y="866" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="17" fill="#171A22">6 Cancel</text><line x1="1035" y1="860" x2="798" y2="860" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ahm)"/><text x="912.5" y="850" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">cancel</text><text x="912.5" y="882" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">toolcancel fires, highlight clears</text><line x1="545" y1="935" x2="782" y2="935" stroke="#C2468A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#ahm)"/><text x="667.5" y="925" text-anchor="middle" font-family="IBM Plex Mono" font-size="16" fill="#171A22">reset() / form removed</text><text x="667.5" y="957" text-anchor="middle" font-family="Literata" font-size="14.5" fill="#5A6478">call canceled, no toolcancel event</text></svg>