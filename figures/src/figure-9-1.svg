t-size="19" fill="#5A6478">Tools off (polyfill-failed)</text><path d="M650.0,511.0 L816.0,511.0" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="664.0" y="501.0" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">no</text><rect x="820.0" y="590" width="280" height="62" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="960" y="629" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="19" fill="#5A6478">Tools off (polyfill-declined)</text><path d="M650.0,621.0 L816.0,621.0" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="664.0" y="611.0" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">no</text><rect x="210.0" y="720" width="440" height="62" rx="9" fill="#EEF1F8" stroke="#5A6478" stroke-width="2.5"/><text x="430" y="759" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="21" fill="#171A22">Register both tools with one signal</text><path d="M210.0,291.0 L120,291.0 L120,751.0 L204.0,751.0" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="130" y="350" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">yes: native</text><path d="M430,652 L430,716" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="442" y="682" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">yes: polyfill</text><path d="M310,782 L310,846" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#ah)"/><text x="298" y="814" text-anchor="end" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">all registered</text><rect x="110.0" y="850" width="300" height="80" rx="9" fill="#B87613"/><text x="260" y="884" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="21" fill="#FFFFFF">Agent tools on</text><text x="260" y="912" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#FFFFFF">native or polyfill, both tools</text><path d="M650.0,751.0 L960,751.0 L960,846" fill="none" stroke="#C2468A" stroke-width="2.5" marker-end="url(#ahm)"/><text x="664.0" y="741.0" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#C2468A" font-style="italic">any registration fails</text><rect x="760" y="850" width="400" height="80" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2.5"/><text x="960" y="884" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="21" fill="#171A22">abort(): withdraw every tool</text><text x="960" y="912" text-anchor="middle" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478">Tools unavailable (err.name)</text><rect x="40" y="975" width="1120" height="56" rx="14" fill="#EEF1F8"/><text x="600" y="1011" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="20" fill="#3F38D6">On every path, people can still search and book. Only the agent tools change.</text><text x="442" y="572" text-anchor="start" font-family="Literata" font-weight="400" font-size="16" fill="#5A6478" font-style="italic">yes</text></svg>